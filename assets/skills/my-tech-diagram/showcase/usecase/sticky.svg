<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="noteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#868E96"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FAFAFA"/>

  <!-- 标题 -->
  <text x="40" y="56" font-size="22" font-weight="600" fill="#343A40">在线商城用例图</text>

  <!-- 系统边界（大矩形 + 粉色分组标题条） -->
  <rect x="320" y="120" width="740" height="620" rx="4" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5" filter="url(#noteShadow)"/>
  <rect x="320" y="120" width="740" height="40" rx="4" fill="#FCE4EC" stroke="#AD1457" stroke-width="1"/>
  <path d="M1028 120 h14 v14 z" fill="#AD1457" opacity="0.55"/>
  <text x="690" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#880E4F">在线商城</text>

  <!-- 用例椭圆（左列：买家）黄色便签 -->
  <ellipse cx="460" cy="240" rx="95" ry="34" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.5" filter="url(#noteShadow)"/>
  <text x="460" y="234" text-anchor="middle" font-size="10" fill="#868E96">用例</text>
  <text x="460" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">浏览商品</text>

  <ellipse cx="460" cy="370" rx="95" ry="34" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.5" filter="url(#noteShadow)"/>
  <text x="460" y="364" text-anchor="middle" font-size="10" fill="#868E96">用例</text>
  <text x="460" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">下单</text>

  <ellipse cx="460" cy="500" rx="95" ry="34" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.5" filter="url(#noteShadow)"/>
  <text x="460" y="494" text-anchor="middle" font-size="10" fill="#868E96">用例</text>
  <text x="460" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">支付订单</text>

  <ellipse cx="460" cy="640" rx="95" ry="34" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.5" filter="url(#noteShadow)"/>
  <text x="460" y="634" text-anchor="middle" font-size="10" fill="#868E96">用例</text>
  <text x="460" y="652" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">申请退款</text>

  <!-- 被 include 的用例：绿色便签 -->
  <ellipse cx="720" cy="630" rx="95" ry="34" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.5" filter="url(#noteShadow)"/>
  <text x="720" y="624" text-anchor="middle" font-size="10" fill="#868E96">用例</text>
  <text x="720" y="642" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">校验库存</text>

  <!-- 用例椭圆（右列：运营）黄色便签 -->
  <ellipse cx="900" cy="260" rx="95" ry="34" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.5" filter="url(#noteShadow)"/>
  <text x="900" y="254" text-anchor="middle" font-size="10" fill="#868E96">用例</text>
  <text x="900" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">上架商品</text>

  <ellipse cx="900" cy="390" rx="95" ry="34" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.5" filter="url(#noteShadow)"/>
  <text x="900" y="384" text-anchor="middle" font-size="10" fill="#868E96">用例</text>
  <text x="900" y="402" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">处理退款</text>

  <!-- 参与者：买家（左） -->
  <g stroke="#343A40" stroke-width="1.5" fill="none">
    <circle cx="150" cy="380" r="14" fill="#FFFFFF"/>
    <line x1="150" y1="394" x2="150" y2="460"/>
    <line x1="118" y1="426" x2="182" y2="426"/>
    <line x1="150" y1="460" x2="126" y2="502"/>
    <line x1="150" y1="460" x2="174" y2="502"/>
  </g>
  <g filter="url(#noteShadow)">
    <rect x="100" y="520" width="100" height="52" rx="3" fill="#FFF9DB" stroke="#B08C00" stroke-width="1.2"/>
    <path d="M186 520 h14 v14 z" fill="#B08C00" opacity="0.55"/>
  </g>
  <text x="150" y="541" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">买家</text>
  <text x="150" y="560" text-anchor="middle" font-size="10" fill="#868E96">主要参与者</text>

  <!-- 参与者：运营（右） -->
  <g stroke="#343A40" stroke-width="1.5" fill="none">
    <circle cx="1250" cy="300" r="14" fill="#FFFFFF"/>
    <line x1="1250" y1="314" x2="1250" y2="380"/>
    <line x1="1218" y1="340" x2="1282" y2="340"/>
    <line x1="1250" y1="380" x2="1226" y2="422"/>
    <line x1="1250" y1="380" x2="1274" y2="422"/>
  </g>
  <g filter="url(#noteShadow)">
    <rect x="1200" y="440" width="100" height="52" rx="3" fill="#FFF9DB" stroke="#B08C00" stroke-width="1.2"/>
    <path d="M1286 440 h14 v14 z" fill="#B08C00" opacity="0.55"/>
  </g>
  <text x="1250" y="461" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">运营</text>
  <text x="1250" y="480" text-anchor="middle" font-size="10" fill="#868E96">参与者</text>

  <!-- 参与者：支付网关（右，外部系统，粉色虚线边便签） -->
  <g stroke="#343A40" stroke-width="1.5" fill="none">
    <circle cx="1250" cy="560" r="14" fill="#FFFFFF"/>
    <line x1="1250" y1="574" x2="1250" y2="640"/>
    <line x1="1218" y1="600" x2="1282" y2="600"/>
    <line x1="1250" y1="640" x2="1226" y2="682"/>
    <line x1="1250" y1="640" x2="1274" y2="682"/>
  </g>
  <g filter="url(#noteShadow)">
    <rect x="1190" y="700" width="120" height="52" rx="3" fill="#FCE4EC" stroke="#C2255C" stroke-width="1.2" stroke-dasharray="5 3"/>
    <path d="M1296 700 h14 v14 z" fill="#C2255C" opacity="0.55"/>
  </g>
  <text x="1250" y="721" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">支付网关</text>
  <text x="1250" y="740" text-anchor="middle" font-size="10" fill="#868E96">外部系统</text>

  <!-- 关联（实线，无箭头）：买家 -->
  <g stroke="#ADB5BD" stroke-width="1.5">
    <line x1="182" y1="410" x2="414" y2="268"/>
    <line x1="182" y1="430" x2="381" y2="387"/>
    <line x1="182" y1="450" x2="377" y2="486"/>
    <line x1="182" y1="470" x2="414" y2="610"/>
  </g>

  <!-- 关联（实线，无箭头）：运营 -->
  <g stroke="#ADB5BD" stroke-width="1.5">
    <line x1="1282" y1="320" x2="989" y2="273"/>
    <line x1="1282" y1="350" x2="989" y2="381"/>
  </g>

  <!-- 关联（实线，无箭头）：支付网关 — 支付订单 -->
  <line x1="1218" y1="602" x2="557" y2="503" stroke="#ADB5BD" stroke-width="1.5"/>

  <!-- include：支付订单 → 校验库存 -->
  <line x1="515" y1="528" x2="663" y2="601" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="589" y="552" text-anchor="middle" font-size="11" fill="#868E96">«include»</text>

  <!-- 图例 -->
  <line x1="40" y1="800" x2="90" y2="800" stroke="#ADB5BD" stroke-width="1.5"/>
  <text x="100" y="804" font-size="11" fill="#868E96">关联（Association）：参与者与用例</text>
  <line x1="40" y1="828" x2="90" y2="828" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="100" y="832" font-size="11" fill="#868E96">«include»：基用例必然执行被指向的用例</text>
</svg>
