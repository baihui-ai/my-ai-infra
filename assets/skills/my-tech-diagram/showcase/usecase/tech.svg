<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#1C2330" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#22D3EE"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#0D1117"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="40" y="56" font-size="22" font-weight="600" fill="#E6EDF3">在线商城用例图</text>
  <rect x="40" y="68" width="120" height="3" rx="1.5" fill="#22D3EE"/>

  <!-- 系统边界 -->
  <rect x="320" y="120" width="740" height="620" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="344" y="152" font-size="16" font-weight="600" fill="#E6EDF3">在线商城</text>

  <!-- 用例椭圆（左列：买家） -->
  <ellipse cx="460" cy="240" rx="95" ry="34" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <text x="460" y="245" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">浏览商品</text>

  <ellipse cx="460" cy="370" rx="95" ry="34" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <text x="460" y="375" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">下单</text>

  <ellipse cx="460" cy="500" rx="95" ry="34" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <text x="460" y="505" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">支付订单</text>

  <ellipse cx="460" cy="640" rx="95" ry="34" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <text x="460" y="645" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">申请退款</text>

  <!-- 被 include 的用例（霓虹青强调 + glow） -->
  <ellipse cx="720" cy="630" rx="95" ry="34" fill="#0D1117" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
  <text x="720" y="635" text-anchor="middle" font-size="14" font-weight="500" fill="#22D3EE">校验库存</text>

  <!-- 用例椭圆（右列：运营） -->
  <ellipse cx="900" cy="260" rx="95" ry="34" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <text x="900" y="265" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">上架商品</text>

  <ellipse cx="900" cy="390" rx="95" ry="34" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <text x="900" y="395" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">处理退款</text>

  <!-- 参与者：买家（左） -->
  <g stroke="#E6EDF3" stroke-width="1.5" fill="none">
    <circle cx="150" cy="380" r="14" fill="#161B22"/>
    <line x1="150" y1="394" x2="150" y2="460"/>
    <line x1="118" y1="426" x2="182" y2="426"/>
    <line x1="150" y1="460" x2="126" y2="502"/>
    <line x1="150" y1="460" x2="174" y2="502"/>
  </g>
  <text x="150" y="536" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">买家</text>
  <text x="150" y="558" text-anchor="middle" font-size="11" fill="#8B949E">主要参与者</text>

  <!-- 参与者：运营（右） -->
  <g stroke="#E6EDF3" stroke-width="1.5" fill="none">
    <circle cx="1250" cy="300" r="14" fill="#161B22"/>
    <line x1="1250" y1="314" x2="1250" y2="380"/>
    <line x1="1218" y1="340" x2="1282" y2="340"/>
    <line x1="1250" y1="380" x2="1226" y2="422"/>
    <line x1="1250" y1="380" x2="1274" y2="422"/>
  </g>
  <text x="1250" y="456" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">运营</text>
  <text x="1250" y="478" text-anchor="middle" font-size="11" fill="#8B949E">参与者</text>

  <!-- 参与者：支付网关（右，外部系统，霓虹紫） -->
  <g stroke="#A78BFA" stroke-width="1.5" fill="none">
    <circle cx="1250" cy="504" r="14" fill="#161B22"/>
    <line x1="1250" y1="518" x2="1250" y2="584"/>
    <line x1="1218" y1="544" x2="1282" y2="544"/>
    <line x1="1250" y1="584" x2="1226" y2="626"/>
    <line x1="1250" y1="584" x2="1274" y2="626"/>
  </g>
  <text x="1250" y="660" text-anchor="middle" font-size="14" font-weight="600" fill="#A78BFA">支付网关</text>
  <text x="1250" y="682" text-anchor="middle" font-size="11" fill="#8B949E">外部系统</text>

  <!-- 关联（实线，无箭头）：买家 -->
  <g stroke="#3D4450" stroke-width="1.5">
    <line x1="182" y1="410" x2="414" y2="268"/>
    <line x1="182" y1="430" x2="381" y2="387"/>
    <line x1="182" y1="450" x2="377" y2="486"/>
    <line x1="182" y1="470" x2="414" y2="610"/>
  </g>

  <!-- 关联（实线，无箭头）：运营 -->
  <g stroke="#3D4450" stroke-width="1.5">
    <line x1="1282" y1="320" x2="989" y2="273"/>
    <line x1="1282" y1="350" x2="989" y2="381"/>
  </g>

  <!-- 关联（实线，无箭头）：支付网关 — 支付订单 -->
  <line x1="1218" y1="546" x2="557" y2="503" stroke="#3D4450" stroke-width="1.5"/>

  <!-- include：支付订单 → 校验库存（霓虹青虚线 + glow） -->
  <line x1="515" y1="528" x2="663" y2="601" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#glow)"/>
  <text x="589" y="552" text-anchor="middle" font-size="11" fill="#22D3EE">«include»</text>

  <!-- 图例 -->
  <line x1="40" y1="800" x2="90" y2="800" stroke="#3D4450" stroke-width="1.5"/>
  <text x="100" y="804" font-size="11" fill="#8B949E">关联（Association）：参与者与用例</text>
  <line x1="40" y1="828" x2="90" y2="828" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="100" y="832" font-size="11" fill="#8B949E">«include»：基用例必然执行被指向的用例</text>
</svg>
