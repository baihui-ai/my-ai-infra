<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="40" y="60" font-size="22" font-weight="600" fill="#1F2328">项目排期甘特图（2026）</text>
  <text x="40" y="88" font-size="12" fill="#6B7280">2026-03-02 – 2026-04-20 · 自然日均匀刻度（周末浅灰底纹）· 蓝色 = 关键路径（CPM 推导）· 关键路径条脉冲动画</text>

  <!-- 月份带 -->
  <text x="650" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">2026 年 3 月</text>
  <text x="1300" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">2026 年 4 月</text>
  <line x1="1040" y1="100" x2="1040" y2="152" stroke="#DDE1E6" stroke-width="1"/>

  <!-- 表头 -->
  <text x="40" y="142" font-size="11" fill="#6B7280">任务</text>
  <g font-size="11" fill="#6B7280" text-anchor="middle">
    <text x="260" y="142">3/2</text>
    <text x="442" y="142">3/9</text>
    <text x="624" y="142">3/16</text>
    <text x="806" y="142">3/23</text>
    <text x="988" y="142">3/30</text>
    <text x="1170" y="142">4/6</text>
    <text x="1352" y="142">4/13</text>
    <text x="1534" y="142">4/20</text>
  </g>
  <line x1="40" y1="152" x2="1560" y2="152" stroke="#E5E7EB" stroke-width="1"/>

  <!-- 周末底纹（周六–周日） -->
  <g fill="#F7F8FA">
    <rect x="390" y="152" width="52" height="520"/>
    <rect x="572" y="152" width="52" height="520"/>
    <rect x="754" y="152" width="52" height="520"/>
    <rect x="936" y="152" width="52" height="520"/>
    <rect x="1118" y="152" width="52" height="520"/>
    <rect x="1300" y="152" width="52" height="520"/>
    <rect x="1482" y="152" width="52" height="520"/>
  </g>

  <!-- 周刻度竖线（周一） -->
  <g stroke="#EDEFF2" stroke-width="1">
    <line x1="260" y1="152" x2="260" y2="672"/>
    <line x1="442" y1="152" x2="442" y2="672"/>
    <line x1="624" y1="152" x2="624" y2="672"/>
    <line x1="806" y1="152" x2="806" y2="672"/>
    <line x1="988" y1="152" x2="988" y2="672"/>
    <line x1="1170" y1="152" x2="1170" y2="672"/>
    <line x1="1352" y1="152" x2="1352" y2="672"/>
    <line x1="1534" y1="152" x2="1534" y2="672"/>
  </g>
  <line x1="1040" y1="152" x2="1040" y2="672" stroke="#DDE1E6" stroke-width="1"/>
  <line x1="240" y1="152" x2="240" y2="672" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="40" y1="672" x2="1560" y2="672" stroke="#E5E7EB" stroke-width="1"/>

  <!-- 依赖箭头（前置右端 → 后继左端，FS） -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- 需求评审 → 后端开发（跳线跨过关键箭头） -->
    <path d="M 390 197 H 416 V 224 H 412 A 8 8 0 0 1 396 224 H 322 V 348 H 441" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrGray)"/>
    <!-- 后端开发 → 联调测试 -->
    <path d="M 936 348 H 1152 V 513 H 1169" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrGray)"/>
    <!-- 需求评审 → UI 设计（关键，虚线流动） -->
    <path d="M 390 187 H 404 V 231 H 330 V 270 H 337" stroke="#2563EB" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrBlue)">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <!-- UI 设计 → 前端开发（关键，虚线流动） -->
    <path d="M 572 270 H 584 V 309 H 428 V 426 H 623" stroke="#2563EB" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrBlue)">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <!-- 前端开发 → 联调测试（关键，虚线流动） -->
    <path d="M 1118 426 H 1132 V 495 H 1169" stroke="#2563EB" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrBlue)">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 任务条 -->
  <!-- R1 需求评审（关键路径，脉冲） -->
  <rect x="260" y="172" width="130" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2">
    <animate attributeName="opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="325" y="196" text-anchor="middle" font-size="11" fill="#2563EB">3/2 – 3/6</text>
  <!-- R2 UI 设计（关键路径，脉冲） -->
  <rect x="338" y="250" width="234" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2">
    <animate attributeName="opacity" values="1;0.55;1" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <text x="455" y="274" text-anchor="middle" font-size="11" fill="#2563EB">3/5 – 3/13</text>
  <!-- R3 后端开发 -->
  <rect x="442" y="328" width="494" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="689" y="352" text-anchor="middle" font-size="11" fill="#6B7280">3/9 – 3/27</text>
  <!-- R4 前端开发（关键路径，脉冲） -->
  <rect x="624" y="406" width="494" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2">
    <animate attributeName="opacity" values="1;0.55;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <text x="871" y="430" text-anchor="middle" font-size="11" fill="#2563EB">3/16 – 4/3</text>
  <!-- R5 联调测试（关键路径，脉冲） -->
  <rect x="1170" y="484" width="312" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2">
    <animate attributeName="opacity" values="1;0.55;1" dur="2s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
  <text x="1326" y="508" text-anchor="middle" font-size="11" fill="#2563EB">4/6 – 4/17</text>

  <!-- 里程碑：上线 4/20（脉冲） -->
  <path d="M 1547 573 L 1561 586 L 1547 599 L 1533 586 Z" fill="#2563EB">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="1520" y="590" text-anchor="end" font-size="11" fill="#6B7280">4/20</text>

  <!-- 左列任务名 -->
  <g font-size="14" font-weight="500" fill="#1F2328">
    <text x="40" y="197">需求评审</text>
    <text x="40" y="275">UI 设计</text>
    <text x="40" y="353">后端开发</text>
    <text x="40" y="431">前端开发</text>
    <text x="40" y="509">联调测试</text>
    <text x="40" y="591">上线</text>
  </g>
  <text x="40" y="611" font-size="10" fill="#6B7280">里程碑</text>

  <!-- 图例 -->
  <rect x="40" y="724" width="24" height="12" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="74" y="734" font-size="11" fill="#6B7280">关键路径任务（脉冲）</text>
  <rect x="200" y="724" width="24" height="12" rx="3" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="234" y="734" font-size="11" fill="#6B7280">普通任务</text>
  <line x1="300" y1="730" x2="324" y2="730" stroke="#2563EB" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrBlue)"/>
  <text x="332" y="734" font-size="11" fill="#6B7280">关键依赖（FS，流动）</text>
  <line x1="470" y1="730" x2="494" y2="730" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="502" y="734" font-size="11" fill="#6B7280">一般依赖（FS）</text>
  <path d="M 610 724 L 616 730 L 610 736 L 604 730 Z" fill="#2563EB"/>
  <text x="624" y="734" font-size="11" fill="#6B7280">里程碑</text>

  <!-- 脚注 -->
  <g font-size="10" fill="#6B7280">
    <text x="40" y="792">注 1：输入未提供分组/负责人信息，任务按开始时间自上而下平铺；关键路径由 CPM 依据给定日期与依赖推导（需求评审 → UI 设计 → 前端开发 → 联调测试 → 上线），后端开发链存在时间浮动。</text>
    <text x="40" y="814">注 2：上线里程碑与联调测试之间的依赖未在输入中显式给出，故未绘制连线；UI 设计（3/5 开始）与需求评审（3/6 结束）存在 2 天交叠，按输入日期原样绘制。</text>
    <text x="40" y="836">注 3：时间轴为自然日均匀刻度（含周末浅灰底纹），任务条长按起止日期 inclusive 计算。动画为 SMIL 内嵌，静态渲染（如 PNG 导出）自动降级为完整静态图。</text>
  </g>
</svg>
