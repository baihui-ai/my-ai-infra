<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#1C2330" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3D4450"/>
    </marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
  </defs>

  <!-- 背景 + 网格 -->
  <rect width="1600" height="900" fill="#0D1117"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="40" y="60" font-size="22" font-weight="600" fill="#E6EDF3">项目排期甘特图（2026）</text>
  <text x="40" y="88" font-size="12" fill="#8B949E">2026-03-02 – 2026-04-20 · 自然日均匀刻度（周末浅底纹）· 青色 = 关键路径（CPM 推导）</text>

  <!-- 月份带 -->
  <text x="650" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EDF3">2026 年 3 月</text>
  <text x="1300" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EDF3">2026 年 4 月</text>
  <line x1="1040" y1="100" x2="1040" y2="152" stroke="#30363D" stroke-width="1"/>

  <!-- 表头 -->
  <text x="40" y="142" font-size="11" fill="#8B949E">任务</text>
  <g font-size="11" fill="#8B949E" text-anchor="middle">
    <text x="260" y="142">3/2</text>
    <text x="442" y="142">3/9</text>
    <text x="624" y="142">3/16</text>
    <text x="806" y="142">3/23</text>
    <text x="988" y="142">3/30</text>
    <text x="1170" y="142">4/6</text>
    <text x="1352" y="142">4/13</text>
    <text x="1534" y="142">4/20</text>
  </g>
  <line x1="40" y1="152" x2="1560" y2="152" stroke="#30363D" stroke-width="1"/>

  <!-- 周末底纹（周六–周日） -->
  <g fill="#11161D">
    <rect x="390" y="152" width="52" height="520"/>
    <rect x="572" y="152" width="52" height="520"/>
    <rect x="754" y="152" width="52" height="520"/>
    <rect x="936" y="152" width="52" height="520"/>
    <rect x="1118" y="152" width="52" height="520"/>
    <rect x="1300" y="152" width="52" height="520"/>
    <rect x="1482" y="152" width="52" height="520"/>
  </g>

  <!-- 周刻度竖线（周一） -->
  <g stroke="#1C2330" stroke-width="1">
    <line x1="260" y1="152" x2="260" y2="672"/>
    <line x1="442" y1="152" x2="442" y2="672"/>
    <line x1="624" y1="152" x2="624" y2="672"/>
    <line x1="806" y1="152" x2="806" y2="672"/>
    <line x1="988" y1="152" x2="988" y2="672"/>
    <line x1="1170" y1="152" x2="1170" y2="672"/>
    <line x1="1352" y1="152" x2="1352" y2="672"/>
    <line x1="1534" y1="152" x2="1534" y2="672"/>
  </g>
  <line x1="1040" y1="152" x2="1040" y2="672" stroke="#30363D" stroke-width="1"/>
  <line x1="240" y1="152" x2="240" y2="672" stroke="#30363D" stroke-width="1"/>
  <line x1="40" y1="672" x2="1560" y2="672" stroke="#30363D" stroke-width="1"/>

  <!-- 依赖箭头（前置右端 → 后继左端，FS） -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- 需求评审 → 后端开发（跳线跨过关键箭头） -->
    <path d="M 390 197 H 416 V 224 H 412 A 8 8 0 0 1 396 224 H 322 V 348 H 441" stroke="#3D4450" stroke-width="1.5" marker-end="url(#arrGray)"/>
    <!-- 后端开发 → 联调测试 -->
    <path d="M 936 348 H 1152 V 513 H 1169" stroke="#3D4450" stroke-width="1.5" marker-end="url(#arrGray)"/>
    <!-- 需求评审 → UI 设计（关键） -->
    <path d="M 390 187 H 404 V 231 H 330 V 270 H 337" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrCyan)" filter="url(#glow)"/>
    <!-- UI 设计 → 前端开发（关键） -->
    <path d="M 572 270 H 584 V 309 H 428 V 426 H 623" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrCyan)" filter="url(#glow)"/>
    <!-- 前端开发 → 联调测试（关键） -->
    <path d="M 1118 426 H 1132 V 495 H 1169" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrCyan)" filter="url(#glow)"/>
  </g>

  <!-- 任务条 -->
  <!-- R1 需求评审（关键路径） -->
  <rect x="260" y="172" width="130" height="40" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
  <text x="325" y="196" text-anchor="middle" font-size="11" fill="#22D3EE">3/2 – 3/6</text>
  <!-- R2 UI 设计（关键路径） -->
  <rect x="338" y="250" width="234" height="40" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
  <text x="455" y="274" text-anchor="middle" font-size="11" fill="#22D3EE">3/5 – 3/13</text>
  <!-- R3 后端开发 -->
  <rect x="442" y="328" width="494" height="40" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="689" y="352" text-anchor="middle" font-size="11" fill="#8B949E">3/9 – 3/27</text>
  <!-- R4 前端开发（关键路径） -->
  <rect x="624" y="406" width="494" height="40" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
  <text x="871" y="430" text-anchor="middle" font-size="11" fill="#22D3EE">3/16 – 4/3</text>
  <!-- R5 联调测试（关键路径） -->
  <rect x="1170" y="484" width="312" height="40" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
  <text x="1326" y="508" text-anchor="middle" font-size="11" fill="#22D3EE">4/6 – 4/17</text>

  <!-- 里程碑：上线 4/20 -->
  <path d="M 1547 573 L 1561 586 L 1547 599 L 1533 586 Z" fill="#22D3EE" filter="url(#glow)"/>
  <text x="1520" y="590" text-anchor="end" font-size="11" fill="#8B949E">4/20</text>

  <!-- 左列任务名 -->
  <g font-size="14" font-weight="500" fill="#E6EDF3">
    <text x="40" y="197">需求评审</text>
    <text x="40" y="275">UI 设计</text>
    <text x="40" y="353">后端开发</text>
    <text x="40" y="431">前端开发</text>
    <text x="40" y="509">联调测试</text>
    <text x="40" y="591">上线</text>
  </g>
  <text x="40" y="611" font-size="10" fill="#8B949E">里程碑</text>

  <!-- 图例 -->
  <rect x="40" y="724" width="24" height="12" rx="3" fill="#161B22" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="74" y="734" font-size="11" fill="#8B949E">关键路径任务</text>
  <rect x="170" y="724" width="24" height="12" rx="3" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="204" y="734" font-size="11" fill="#8B949E">普通任务</text>
  <line x1="270" y1="730" x2="294" y2="730" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="302" y="734" font-size="11" fill="#8B949E">关键依赖（FS）</text>
  <line x1="410" y1="730" x2="434" y2="730" stroke="#3D4450" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="442" y="734" font-size="11" fill="#8B949E">一般依赖（FS）</text>
  <path d="M 540 724 L 546 730 L 540 736 L 534 730 Z" fill="#22D3EE"/>
  <text x="554" y="734" font-size="11" fill="#8B949E">里程碑</text>

  <!-- 脚注 -->
  <g font-size="10" fill="#8B949E">
    <text x="40" y="792">注 1：输入未提供分组/负责人信息，任务按开始时间自上而下平铺；关键路径由 CPM 依据给定日期与依赖推导（需求评审 → UI 设计 → 前端开发 → 联调测试 → 上线），后端开发链存在时间浮动。</text>
    <text x="40" y="814">注 2：上线里程碑与联调测试之间的依赖未在输入中显式给出，故未绘制连线；UI 设计（3/5 开始）与需求评审（3/6 结束）存在 2 天交叠，按输入日期原样绘制。</text>
    <text x="40" y="836">注 3：时间轴为自然日均匀刻度（含周末浅底纹），任务条长按起止日期 inclusive 计算。</text>
  </g>
</svg>
