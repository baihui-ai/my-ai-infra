<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <text x="48" y="52" font-size="22" font-weight="600" fill="#1F2328">在线商城系统 · C4 Container 架构图</text>
  <text x="48" y="76" font-size="12" fill="#6B7280">层级：Container（L2） | 范围：商城系统内部容器与外部依赖 | 风格：简洁 minimal</text>

  <!-- System Boundary -->
  <rect x="330" y="110" width="610" height="510" rx="14" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="346" y="136" font-size="12" fill="#6B7280">在线商城系统 [Software System]</text>

  <!-- 连线 -->
  <path d="M244 348 H420 V198 H496" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrG)"/>
  <path d="M630 246 V306" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <path d="M580 406 V452 H495 V462" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrG)"/>
  <path d="M680 406 V452 H775 V462" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrG)"/>
  <path d="M764 340 H880 V275 H996" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrG)"/>
  <path d="M764 390 H918 V445 H996" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- 连线标签 -->
  <text x="332" y="326" text-anchor="middle" font-size="12" fill="#6B7280">浏览商品、提交订单</text>
  <text x="332" y="342" text-anchor="middle" font-size="12" fill="#6B7280">[HTTPS]</text>
  <text x="712" y="272" text-anchor="middle" font-size="12" fill="#2563EB">调用业务 API</text>
  <text x="712" y="288" text-anchor="middle" font-size="12" fill="#2563EB">[JSON/HTTPS]</text>
  <text x="527" y="436" text-anchor="middle" font-size="12" fill="#6B7280">读写商品/订单 [JDBC]</text>
  <text x="737" y="436" text-anchor="middle" font-size="12" fill="#6B7280">读写缓存 [RESP]</text>
  <text x="822" y="356" text-anchor="middle" font-size="12" fill="#6B7280">发起支付/接收回调</text>
  <text x="822" y="372" text-anchor="middle" font-size="12" fill="#6B7280">[HTTPS/REST]</text>
  <text x="840" y="412" text-anchor="middle" font-size="12" fill="#6B7280">创建运单/查询轨迹</text>
  <text x="840" y="428" text-anchor="middle" font-size="12" fill="#6B7280">[HTTPS/REST]</text>

  <!-- Person：商城用户 -->
  <rect x="60" y="300" width="180" height="96" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="150" y="336" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">商城用户</text>
  <text x="150" y="354" text-anchor="middle" font-size="11" fill="#6B7280">[Person]</text>
  <text x="150" y="372" text-anchor="middle" font-size="11" fill="#6B7280">微信小程序 / 浏览器访问</text>

  <!-- Container：Web 前端 -->
  <rect x="500" y="150" width="260" height="96" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="630" y="186" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">Web 前端</text>
  <text x="630" y="204" text-anchor="middle" font-size="11" fill="#6B7280">[Container: React SPA]</text>
  <text x="630" y="222" text-anchor="middle" font-size="11" fill="#6B7280">商品浏览、购物车、下单页面</text>

  <!-- Container：商城 API 服务（核心节点，强调色） -->
  <rect x="500" y="310" width="260" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="630" y="346" text-anchor="middle" font-size="14" font-weight="500" fill="#2563EB">商城 API 服务</text>
  <text x="630" y="364" text-anchor="middle" font-size="11" fill="#6B7280">[Container: Java Spring Boot]</text>
  <text x="630" y="382" text-anchor="middle" font-size="11" fill="#6B7280">订单、支付、物流业务逻辑</text>

  <!-- Container：PostgreSQL（圆柱体） -->
  <path d="M380 480 V576 A115 14 0 0 0 610 576 V480" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <ellipse cx="495" cy="480" rx="115" ry="14" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="495" y="522" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">业务数据库</text>
  <text x="495" y="540" text-anchor="middle" font-size="11" fill="#6B7280">[Container: PostgreSQL]</text>
  <text x="495" y="558" text-anchor="middle" font-size="11" fill="#6B7280">商品、订单、用户数据</text>

  <!-- Container：Redis（圆柱体） -->
  <path d="M660 480 V576 A115 14 0 0 0 890 576 V480" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <ellipse cx="775" cy="480" rx="115" ry="14" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="775" y="522" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">缓存</text>
  <text x="775" y="540" text-anchor="middle" font-size="11" fill="#6B7280">[Container: Redis]</text>
  <text x="775" y="558" text-anchor="middle" font-size="11" fill="#6B7280">热点数据缓存</text>

  <!-- 外部系统：微信支付 -->
  <rect x="1000" y="230" width="160" height="90" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="1080" y="266" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">微信支付</text>
  <text x="1080" y="284" text-anchor="middle" font-size="11" fill="#6B7280">[外部系统]</text>
  <text x="1080" y="302" text-anchor="middle" font-size="11" fill="#6B7280">支付下单与回调</text>

  <!-- 外部系统：顺丰物流 -->
  <rect x="1000" y="400" width="160" height="90" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="1080" y="436" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">顺丰物流</text>
  <text x="1080" y="454" text-anchor="middle" font-size="11" fill="#6B7280">[外部系统]</text>
  <text x="1080" y="472" text-anchor="middle" font-size="11" fill="#6B7280">运单与轨迹查询</text>

  <!-- 图例 -->
  <rect x="48" y="690" width="14" height="14" rx="3" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="70" y="701" font-size="10" fill="#6B7280">用户 Person</text>
  <rect x="170" y="690" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="192" y="701" font-size="10" fill="#6B7280">容器 Container</text>
  <path d="M310 694 V704 A8 3 0 0 0 326 704 V694" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <ellipse cx="318" cy="694" rx="8" ry="3" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="334" y="701" font-size="10" fill="#6B7280">数据库 / 缓存</text>
  <rect x="434" y="690" width="14" height="14" rx="3" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="456" y="701" font-size="10" fill="#6B7280">外部系统</text>
  <line x1="560" y1="697" x2="592" y2="697" stroke="#2563EB" stroke-width="2"/>
  <text x="600" y="701" font-size="10" fill="#6B7280">核心链路</text>
  <line x1="680" y1="697" x2="712" y2="697" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="720" y="701" font-size="10" fill="#6B7280">系统边界</text>
</svg>
