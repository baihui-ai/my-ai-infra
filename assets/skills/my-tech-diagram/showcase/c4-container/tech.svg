<svg viewBox="0 0 1180 750" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#1C2330" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3D4450"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#22D3EE"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1180" height="750" fill="#0D1117"/>
  <rect width="1180" height="750" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="48" y="56" font-size="22" font-weight="600" fill="#E6EDF3">在线商城系统 · C4 Container 架构图</text>
  <text x="48" y="80" font-size="12" fill="#8B949E">层级：Container（L2） | 范围：商城系统内部容器与外部依赖 | 风格：科技炫酷</text>

  <!-- System Boundary -->
  <rect x="320" y="140" width="620" height="520" rx="14" fill="none" stroke="#3D4450" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="336" y="166" font-size="12" fill="#8B949E">在线商城系统 [Software System]</text>

  <!-- 连线（画在节点之下，标签在线之上） -->
  <!-- 1 用户 -> Web 前端 -->
  <path d="M244 378 H420 V238 H496" fill="none" stroke="#3D4450" stroke-width="1.5" marker-end="url(#arrG)"/>
  <!-- 2 前端 -> API（核心链路，青色发光） -->
  <path d="M630 288 V346" fill="none" stroke="#22D3EE" stroke-width="1.5" filter="url(#glow)" marker-end="url(#arrC)"/>
  <!-- 3 API -> PostgreSQL -->
  <path d="M560 448 V482 H495 V494" fill="none" stroke="#3D4450" stroke-width="1.5" marker-end="url(#arrG)"/>
  <!-- 4 API -> Redis -->
  <path d="M700 448 V482 H775 V494" fill="none" stroke="#3D4450" stroke-width="1.5" marker-end="url(#arrG)"/>
  <!-- 5 API -> 微信支付 -->
  <path d="M762 390 H875 V315 H986" fill="none" stroke="#3D4450" stroke-width="1.5" marker-end="url(#arrG)"/>
  <!-- 6 API -> 顺丰物流 -->
  <path d="M762 420 H910 V485 H986" fill="none" stroke="#3D4450" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- 连线标签 -->
  <text x="332" y="356" text-anchor="middle" font-size="12" fill="#8B949E">浏览商品、提交订单</text>
  <text x="332" y="372" text-anchor="middle" font-size="12" fill="#8B949E">[HTTPS]</text>
  <text x="710" y="312" text-anchor="middle" font-size="12" fill="#22D3EE">调用业务 API</text>
  <text x="710" y="328" text-anchor="middle" font-size="12" fill="#22D3EE">[JSON/HTTPS]</text>
  <text x="527" y="466" text-anchor="middle" font-size="12" fill="#8B949E">读写商品/订单 [JDBC]</text>
  <text x="737" y="466" text-anchor="middle" font-size="12" fill="#8B949E">读写缓存 [RESP]</text>
  <text x="818" y="362" text-anchor="middle" font-size="12" fill="#8B949E">发起支付/接收回调</text>
  <text x="818" y="378" text-anchor="middle" font-size="12" fill="#8B949E">[HTTPS/REST]</text>
  <text x="835" y="398" text-anchor="middle" font-size="12" fill="#8B949E">创建运单/查询轨迹</text>
  <text x="835" y="413" text-anchor="middle" font-size="12" fill="#8B949E">[HTTPS/REST]</text>

  <!-- Person：商城用户 -->
  <rect x="64" y="330" width="180" height="96" rx="10" fill="#161B22" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="154" y="366" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">商城用户</text>
  <text x="154" y="384" text-anchor="middle" font-size="11" fill="#A78BFA">[Person]</text>
  <text x="154" y="402" text-anchor="middle" font-size="11" fill="#8B949E">微信小程序 / 浏览器访问</text>

  <!-- Container：Web 前端 -->
  <rect x="500" y="190" width="260" height="96" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="630" y="226" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">Web 前端</text>
  <text x="630" y="244" text-anchor="middle" font-size="11" fill="#8B949E">[Container: React SPA]</text>
  <text x="630" y="262" text-anchor="middle" font-size="11" fill="#8B949E">商品浏览、购物车、下单页面</text>

  <!-- Container：商城 API 服务（核心节点，青色描边 + glow） -->
  <rect x="500" y="350" width="260" height="96" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
  <text x="630" y="386" text-anchor="middle" font-size="14" font-weight="500" fill="#22D3EE">商城 API 服务</text>
  <text x="630" y="404" text-anchor="middle" font-size="11" fill="#8B949E">[Container: Java Spring Boot]</text>
  <text x="630" y="422" text-anchor="middle" font-size="11" fill="#8B949E">订单、支付、物流业务逻辑</text>

  <!-- Container：PostgreSQL（圆柱体） -->
  <path d="M380 510 V606 A115 14 0 0 0 610 606 V510" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <ellipse cx="495" cy="510" rx="115" ry="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="495" y="552" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">业务数据库</text>
  <text x="495" y="570" text-anchor="middle" font-size="11" fill="#8B949E">[Container: PostgreSQL]</text>
  <text x="495" y="588" text-anchor="middle" font-size="11" fill="#8B949E">商品、订单、用户数据</text>

  <!-- Container：Redis（圆柱体） -->
  <path d="M660 510 V606 A115 14 0 0 0 890 606 V510" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <ellipse cx="775" cy="510" rx="115" ry="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="775" y="552" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">缓存</text>
  <text x="775" y="570" text-anchor="middle" font-size="11" fill="#8B949E">[Container: Redis]</text>
  <text x="775" y="588" text-anchor="middle" font-size="11" fill="#8B949E">热点数据缓存</text>

  <!-- 外部系统：微信支付 -->
  <rect x="990" y="270" width="160" height="90" rx="10" fill="#161B22" stroke="#6B7280" stroke-width="1.5"/>
  <text x="1070" y="306" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">微信支付</text>
  <text x="1070" y="324" text-anchor="middle" font-size="11" fill="#8B949E">[外部系统]</text>
  <text x="1070" y="342" text-anchor="middle" font-size="11" fill="#8B949E">支付下单与回调</text>

  <!-- 外部系统：顺丰物流 -->
  <rect x="990" y="440" width="160" height="90" rx="10" fill="#161B22" stroke="#6B7280" stroke-width="1.5"/>
  <text x="1070" y="476" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">顺丰物流</text>
  <text x="1070" y="494" text-anchor="middle" font-size="11" fill="#8B949E">[外部系统]</text>
  <text x="1070" y="512" text-anchor="middle" font-size="11" fill="#8B949E">运单与轨迹查询</text>

  <!-- 图例 -->
  <rect x="48" y="698" width="14" height="14" rx="3" fill="#161B22" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="70" y="709" font-size="10" fill="#8B949E">用户 Person</text>
  <rect x="170" y="698" width="14" height="14" rx="3" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="192" y="709" font-size="10" fill="#8B949E">容器 Container</text>
  <path d="M310 702 V712 A8 3 0 0 0 326 712 V702" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <ellipse cx="318" cy="702" rx="8" ry="3" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="334" y="709" font-size="10" fill="#8B949E">数据库 / 缓存</text>
  <rect x="434" y="698" width="14" height="14" rx="3" fill="#161B22" stroke="#6B7280" stroke-width="1.5"/>
  <text x="456" y="709" font-size="10" fill="#8B949E">外部系统</text>
  <line x1="560" y1="705" x2="592" y2="705" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="600" y="709" font-size="10" fill="#8B949E">核心链路</text>
  <line x1="680" y1="705" x2="712" y2="705" stroke="#3D4450" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="720" y="709" font-size="10" fill="#8B949E">系统边界</text>
</svg>
