<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F8A54"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2542F"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5E83"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F5F1EA"/>

  <!-- 标题（衬线） -->
  <text x="40" y="52" font-size="22" font-weight="600" fill="#2B2118" font-family="Georgia, 'Times New Roman', 'Songti SC', 'SimSun', serif">限界上下文映射图</text>
  <text x="40" y="78" font-size="12" fill="#8A7B6B">Context Map · 箭头方向 = 影响方向（上游 → 下游）</text>

  <!-- ===== 分带背景 ===== -->
  <!-- 核心域 -->
  <rect x="180" y="100" width="1100" height="160" rx="10" fill="#ECE5D8"/>
  <text x="204" y="178" font-size="14" font-weight="600" fill="#2B2118" font-family="Georgia, 'Times New Roman', 'Songti SC', 'SimSun', serif">核心域</text>
  <text x="204" y="198" font-size="11" fill="#8A7B6B">Core Domain</text>
  <text x="204" y="218" font-size="10" fill="#8A7B6B">差异化竞争力，重点投入</text>

  <!-- 支撑域 -->
  <rect x="180" y="280" width="1100" height="160" rx="10" fill="#ECE5D8"/>
  <text x="204" y="358" font-size="14" font-weight="600" fill="#2B2118" font-family="Georgia, 'Times New Roman', 'Songti SC', 'SimSun', serif">支撑域</text>
  <text x="204" y="378" font-size="11" fill="#8A7B6B">Supporting</text>
  <text x="204" y="398" font-size="10" fill="#8A7B6B">支撑核心域，定制开发</text>

  <!-- 通用域 -->
  <rect x="180" y="460" width="1100" height="160" rx="10" fill="#ECE5D8"/>
  <text x="204" y="538" font-size="14" font-weight="600" fill="#2B2118" font-family="Georgia, 'Times New Roman', 'Songti SC', 'SimSun', serif">通用域</text>
  <text x="204" y="558" font-size="11" fill="#8A7B6B">Generic</text>
  <text x="204" y="578" font-size="10" fill="#8A7B6B">通用能力，可外购复用</text>

  <!-- ===== 关系连线 ===== -->
  <!-- 1. 定价 → 订单：供需配合 C/S -->
  <line x1="560" y1="180" x2="656" y2="180" stroke="#5F8A54" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="610" y="164" text-anchor="middle" font-size="11" font-weight="500" fill="#5F8A54">供需配合 C/S</text>

  <!-- 2. 库存 → 订单：供需配合 C/S -->
  <line x1="770" y1="308" x2="770" y2="236" stroke="#5F8A54" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="782" y="276" text-anchor="start" font-size="11" font-weight="500" fill="#5F8A54">供需配合 C/S</text>

  <!-- 3. 权限 → 订单：遵奉者 CF（折线） -->
  <path d="M 1070 488 L 1070 202 L 884 202" fill="none" stroke="#C2542F" stroke-width="1.5" marker-end="url(#arrOrange)"/>
  <text x="1082" y="350" text-anchor="start" font-size="11" font-weight="500" fill="#C2542F">遵奉者 CF</text>

  <!-- 4. 用户 ↔ 权限：共享内核 SK（双向） -->
  <line x1="560" y1="540" x2="956" y2="540" stroke="#5F8A54" stroke-width="1.5" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>
  <text x="758" y="524" text-anchor="middle" font-size="11" font-weight="500" fill="#5F8A54">共享内核 SK</text>

  <!-- 5. 支付宝 → 订单：防腐层 ACL -->
  <line x1="1350" y1="158" x2="908" y2="158" stroke="#8B5E83" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="1129" y="142" text-anchor="middle" font-size="11" font-weight="500" fill="#8B5E83">防腐层 ACL</text>

  <!-- ===== 上下文卡片 ===== -->
  <!-- 定价上下文（核心域） -->
  <rect x="340" y="128" width="220" height="104" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
  <text x="450" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2118">定价上下文</text>
  <text x="450" y="184" text-anchor="middle" font-size="11" fill="#8A7B6B">Pricing Context</text>
  <text x="450" y="206" text-anchor="middle" font-size="11" fill="#8A7B6B">报价与折扣计算</text>

  <!-- 订单上下文（核心域，强调：顶部主色条 + 主色名） -->
  <rect x="660" y="128" width="220" height="104" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
  <rect x="660" y="128" width="220" height="4" rx="2" fill="#D97757"/>
  <text x="770" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#C2542F">订单上下文</text>
  <text x="770" y="184" text-anchor="middle" font-size="11" fill="#8A7B6B">Order Context</text>
  <text x="770" y="206" text-anchor="middle" font-size="11" fill="#8A7B6B">订单全生命周期管理</text>

  <!-- ACL 小梯形（订单框右边缘，下游一侧） -->
  <path d="M 880 144 L 904 150 L 904 166 L 880 172 Z" fill="#F0E8F0" stroke="#8B5E83" stroke-width="1.5"/>
  <text x="892" y="161" text-anchor="middle" font-size="9" font-weight="600" fill="#8B5E83">ACL</text>

  <!-- 库存上下文（支撑域） -->
  <rect x="660" y="308" width="220" height="104" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
  <text x="770" y="342" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2118">库存上下文</text>
  <text x="770" y="364" text-anchor="middle" font-size="11" fill="#8A7B6B">Inventory Context</text>
  <text x="770" y="386" text-anchor="middle" font-size="11" fill="#8A7B6B">库存查询与扣减</text>

  <!-- 用户上下文（通用域） -->
  <rect x="340" y="488" width="220" height="104" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
  <text x="450" y="522" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2118">用户上下文</text>
  <text x="450" y="544" text-anchor="middle" font-size="11" fill="#8A7B6B">User Context</text>
  <text x="450" y="566" text-anchor="middle" font-size="11" fill="#8A7B6B">账号认证</text>

  <!-- 权限上下文（通用域） -->
  <rect x="960" y="488" width="220" height="104" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
  <text x="1070" y="522" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2118">权限上下文</text>
  <text x="1070" y="544" text-anchor="middle" font-size="11" fill="#8A7B6B">Permission Context</text>
  <text x="1070" y="566" text-anchor="middle" font-size="11" fill="#8A7B6B">角色与权限</text>

  <!-- 支付宝（外部系统，分带之外，虚线框） -->
  <rect x="1350" y="128" width="220" height="104" rx="10" fill="#F2EDE3" stroke="#B4A892" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1460" y="152" text-anchor="middle" font-size="10" fill="#8A7B6B">外部系统 External</text>
  <text x="1460" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2118">支付宝</text>
  <text x="1460" y="196" text-anchor="middle" font-size="11" fill="#8A7B6B">Alipay</text>
  <text x="1460" y="216" text-anchor="middle" font-size="11" fill="#8A7B6B">外部支付系统</text>

  <!-- ===== 图例 ===== -->
  <line x1="180" y1="684" x2="216" y2="684" stroke="#5F8A54" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="224" y="688" font-size="11" fill="#2B2118">协作类：供需配合 C/S · 共享内核 SK（双向）</text>

  <line x1="560" y1="684" x2="596" y2="684" stroke="#C2542F" stroke-width="1.5" marker-end="url(#arrOrange)"/>
  <text x="604" y="688" font-size="11" fill="#2B2118">遵奉者 CF</text>

  <line x1="720" y1="684" x2="756" y2="684" stroke="#8B5E83" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="764" y="688" font-size="11" fill="#2B2118">防腐层 ACL</text>

  <rect x="900" y="676" width="24" height="16" rx="3" fill="#F2EDE3" stroke="#B4A892" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="932" y="688" font-size="11" fill="#2B2118">外部系统（虚线框）</text>

  <text x="1120" y="688" font-size="11" fill="#8A7B6B">箭头方向 = 影响方向（上游 U → 下游 D）</text>
</svg>
