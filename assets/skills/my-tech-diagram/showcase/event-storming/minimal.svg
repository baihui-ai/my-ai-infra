<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="48" y="52" font-size="22" font-weight="600" fill="#1F2328">电商下单流程 · 事件风暴图</text>
  <text x="48" y="76" font-size="12" fill="#6B7280">分组式领域事件图 · 简洁风 · 空间位置即关系：命令在左、事件在右，组内成对平铺，无连线</text>

  <!-- 图例 -->
  <g font-size="12" fill="#6B7280">
    <rect x="1000" y="40" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="1030" y="51">命令</text>
    <rect x="1086" y="40" width="22" height="14" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1116" y="51">事件</text>
    <rect x="1172" y="40" width="22" height="14" rx="3" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="1202" y="51">参与者</text>
    <rect x="1268" y="40" width="22" height="14" rx="3" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="1298" y="51">外部系统</text>
    <rect x="1376" y="40" width="22" height="14" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="1406" y="51">分组标题</text>
  </g>

  <!-- ========== 分组 1：订单 ========== -->
  <rect x="48" y="96" width="736" height="40" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="416" y="121" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2328">订单</text>

  <!-- 行1：提交订单 → 订单已提交 -->
  <rect x="80" y="160" width="160" height="96" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="160" y="186" text-anchor="middle" font-size="10" fill="#6B7280">命令</text>
  <text x="160" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">提交订单</text>

  <rect x="264" y="160" width="160" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="344" y="186" text-anchor="middle" font-size="10" fill="#6B7280">事件</text>
  <text x="344" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">订单已提交</text>

  <!-- 行2：创建订单 → 订单已创建 / 订单创建失败 -->
  <rect x="80" y="280" width="160" height="96" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="160" y="306" text-anchor="middle" font-size="10" fill="#6B7280">命令</text>
  <text x="160" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">创建订单</text>

  <rect x="264" y="280" width="160" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="344" y="306" text-anchor="middle" font-size="10" fill="#6B7280">事件</text>
  <text x="344" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">订单已创建</text>

  <rect x="448" y="280" width="160" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="528" y="306" text-anchor="middle" font-size="10" fill="#6B7280">事件</text>
  <text x="528" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">订单创建失败</text>

  <!-- 参与者：买家 -->
  <rect x="80" y="396" width="160" height="36" rx="6" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="160" y="419" text-anchor="middle" font-size="12" fill="#6B7280">参与者 · 买家</text>

  <!-- ========== 分组 2：库存 ========== -->
  <rect x="816" y="96" width="736" height="40" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="1184" y="121" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2328">库存</text>

  <!-- 行1：校验库存 → 库存充足已确认 / 库存不足已确认 -->
  <rect x="848" y="160" width="160" height="96" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="928" y="186" text-anchor="middle" font-size="10" fill="#6B7280">命令</text>
  <text x="928" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">校验库存</text>

  <rect x="1032" y="160" width="160" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1112" y="186" text-anchor="middle" font-size="10" fill="#6B7280">事件</text>
  <text x="1112" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">库存充足已确认</text>

  <rect x="1216" y="160" width="160" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1296" y="186" text-anchor="middle" font-size="10" fill="#6B7280">事件</text>
  <text x="1296" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">库存不足已确认</text>

  <!-- 行2：扣减库存 → 库存已扣减 -->
  <rect x="848" y="280" width="160" height="96" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="928" y="306" text-anchor="middle" font-size="10" fill="#6B7280">命令</text>
  <text x="928" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">扣减库存</text>

  <rect x="1032" y="280" width="160" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1112" y="306" text-anchor="middle" font-size="10" fill="#6B7280">事件</text>
  <text x="1112" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">库存已扣减</text>

  <!-- ========== 分组 3：支付 ========== -->
  <rect x="48" y="488" width="736" height="40" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="416" y="513" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2328">支付</text>

  <!-- 行1：发起支付 → 支付已发起 -->
  <rect x="80" y="552" width="160" height="96" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="160" y="578" text-anchor="middle" font-size="10" fill="#6B7280">命令</text>
  <text x="160" y="610" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">发起支付</text>

  <rect x="264" y="552" width="160" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="344" y="578" text-anchor="middle" font-size="10" fill="#6B7280">事件</text>
  <text x="344" y="610" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">支付已发起</text>

  <!-- 行2：支付宝（外部系统） → 支付已成功 -->
  <rect x="80" y="672" width="160" height="96" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="160" y="698" text-anchor="middle" font-size="10" fill="#6B7280">外部系统</text>
  <text x="160" y="730" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">支付宝</text>

  <rect x="264" y="672" width="160" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="344" y="698" text-anchor="middle" font-size="10" fill="#6B7280">事件</text>
  <text x="344" y="730" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">支付已成功</text>

  <!-- ========== 分组 4：发货履约 ========== -->
  <rect x="816" y="488" width="736" height="40" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="1184" y="513" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2328">发货履约</text>

  <!-- 行1：通知仓库发货 → 发货通知已发送 -->
  <rect x="848" y="552" width="160" height="96" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="928" y="578" text-anchor="middle" font-size="10" fill="#6B7280">命令</text>
  <text x="928" y="610" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">通知仓库发货</text>

  <rect x="1032" y="552" width="160" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1112" y="578" text-anchor="middle" font-size="10" fill="#6B7280">事件</text>
  <text x="1112" y="610" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">发货通知已发送</text>

  <!-- 参与者：仓库管理员 -->
  <rect x="848" y="788" width="240" height="36" rx="6" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="968" y="811" text-anchor="middle" font-size="12" fill="#6B7280">参与者 · 仓库管理员（接收发货通知）</text>

  <!-- 脚注 -->
  <text x="800" y="878" text-anchor="middle" font-size="10" fill="#6B7280">命名约定：命令 = 动宾结构（意图），事件 = 名词 + 已 + 动词（已发生的事实）；分支以「一个命令向右并列多个事件」表达</text>
</svg>
