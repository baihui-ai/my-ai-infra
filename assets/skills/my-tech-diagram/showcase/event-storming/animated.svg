<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#1C2330" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#0D1117"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="48" y="52" font-size="22" font-weight="600" fill="url(#titleGrad)">电商下单流程 · 事件风暴图</text>
  <text x="48" y="76" font-size="12" fill="#8B949E">分组式领域事件图 · 动画风（SMIL）· 事件卡右上角光点脉冲 = 该事件处于活跃叙事位；静态结构完整，删掉动画图依然成立</text>

  <!-- 图例 -->
  <g font-size="12" fill="#8B949E">
    <rect x="1000" y="40" width="22" height="14" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="1030" y="51">命令</text>
    <rect x="1086" y="40" width="22" height="14" rx="4" fill="#161B22" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="1116" y="51">事件</text>
    <rect x="1172" y="40" width="22" height="14" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="1202" y="51">参与者</text>
    <rect x="1268" y="40" width="22" height="14" rx="4" fill="#161B22" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="1298" y="51">外部系统</text>
    <rect x="1376" y="40" width="22" height="14" rx="4" fill="#1B1530" stroke="#A78BFA" stroke-width="1"/>
    <text x="1406" y="51">分组标题</text>
  </g>

  <!-- ========== 分组 1：订单 ========== -->
  <rect x="48" y="96" width="736" height="40" rx="10" fill="#1B1530" stroke="#A78BFA" stroke-width="1"/>
  <text x="416" y="121" text-anchor="middle" font-size="15" font-weight="600" fill="#A78BFA">订单</text>

  <!-- 行1：提交订单 → 订单已提交 -->
  <rect x="80" y="160" width="160" height="96" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="160" y="186" text-anchor="middle" font-size="10" fill="#8B949E">命令</text>
  <text x="160" y="218" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">提交订单</text>

  <rect x="264" y="160" width="160" height="96" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2"/>
  <text x="344" y="186" text-anchor="middle" font-size="10" fill="#22D3EE">事件</text>
  <text x="344" y="218" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">订单已提交</text>
  <circle cx="416" cy="168" r="5" fill="#22D3EE" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <!-- 行2：创建订单 → 订单已创建 / 订单创建失败 -->
  <rect x="80" y="280" width="160" height="96" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="160" y="306" text-anchor="middle" font-size="10" fill="#8B949E">命令</text>
  <text x="160" y="338" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">创建订单</text>

  <rect x="264" y="280" width="160" height="96" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2"/>
  <text x="344" y="306" text-anchor="middle" font-size="10" fill="#22D3EE">事件</text>
  <text x="344" y="338" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">订单已创建</text>
  <circle cx="416" cy="288" r="5" fill="#22D3EE" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
  </circle>

  <rect x="448" y="280" width="160" height="96" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2"/>
  <text x="528" y="306" text-anchor="middle" font-size="10" fill="#22D3EE">事件</text>
  <text x="528" y="338" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">订单创建失败</text>
  <circle cx="600" cy="288" r="5" fill="#F472B6" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 参与者：买家 -->
  <rect x="80" y="396" width="160" height="36" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="160" y="419" text-anchor="middle" font-size="12" fill="#8B949E">参与者 · 买家</text>

  <!-- ========== 分组 2：库存 ========== -->
  <rect x="816" y="96" width="736" height="40" rx="10" fill="#1B1530" stroke="#A78BFA" stroke-width="1"/>
  <text x="1184" y="121" text-anchor="middle" font-size="15" font-weight="600" fill="#A78BFA">库存</text>

  <!-- 行1：校验库存 → 库存充足已确认 / 库存不足已确认 -->
  <rect x="848" y="160" width="160" height="96" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="928" y="186" text-anchor="middle" font-size="10" fill="#8B949E">命令</text>
  <text x="928" y="218" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">校验库存</text>

  <rect x="1032" y="160" width="160" height="96" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2"/>
  <text x="1112" y="186" text-anchor="middle" font-size="10" fill="#22D3EE">事件</text>
  <text x="1112" y="218" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">库存充足已确认</text>
  <circle cx="1184" cy="168" r="5" fill="#22D3EE" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <rect x="1216" y="160" width="160" height="96" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2"/>
  <text x="1296" y="186" text-anchor="middle" font-size="10" fill="#22D3EE">事件</text>
  <text x="1296" y="218" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">库存不足已确认</text>
  <circle cx="1368" cy="168" r="5" fill="#F472B6" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 行2：扣减库存 → 库存已扣减 -->
  <rect x="848" y="280" width="160" height="96" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="928" y="306" text-anchor="middle" font-size="10" fill="#8B949E">命令</text>
  <text x="928" y="338" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">扣减库存</text>

  <rect x="1032" y="280" width="160" height="96" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2"/>
  <text x="1112" y="306" text-anchor="middle" font-size="10" fill="#22D3EE">事件</text>
  <text x="1112" y="338" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">库存已扣减</text>
  <circle cx="1184" cy="288" r="5" fill="#22D3EE" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- ========== 分组 3：支付 ========== -->
  <rect x="48" y="488" width="736" height="40" rx="10" fill="#1B1530" stroke="#A78BFA" stroke-width="1"/>
  <text x="416" y="513" text-anchor="middle" font-size="15" font-weight="600" fill="#A78BFA">支付</text>

  <!-- 行1：发起支付 → 支付已发起 -->
  <rect x="80" y="552" width="160" height="96" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="160" y="578" text-anchor="middle" font-size="10" fill="#8B949E">命令</text>
  <text x="160" y="610" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">发起支付</text>

  <rect x="264" y="552" width="160" height="96" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2"/>
  <text x="344" y="578" text-anchor="middle" font-size="10" fill="#22D3EE">事件</text>
  <text x="344" y="610" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">支付已发起</text>
  <circle cx="416" cy="560" r="5" fill="#22D3EE" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 行2：支付宝（外部系统） → 支付已成功 -->
  <rect x="80" y="672" width="160" height="96" rx="10" fill="#161B22" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="160" y="698" text-anchor="middle" font-size="10" fill="#8B949E">外部系统</text>
  <text x="160" y="730" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">支付宝</text>

  <rect x="264" y="672" width="160" height="96" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2"/>
  <text x="344" y="698" text-anchor="middle" font-size="10" fill="#22D3EE">事件</text>
  <text x="344" y="730" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">支付已成功</text>
  <circle cx="416" cy="680" r="5" fill="#22D3EE" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" begin="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ========== 分组 4：发货履约 ========== -->
  <rect x="816" y="488" width="736" height="40" rx="10" fill="#1B1530" stroke="#A78BFA" stroke-width="1"/>
  <text x="1184" y="513" text-anchor="middle" font-size="15" font-weight="600" fill="#A78BFA">发货履约</text>

  <!-- 行1：通知仓库发货 → 发货通知已发送 -->
  <rect x="848" y="552" width="160" height="96" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="928" y="578" text-anchor="middle" font-size="10" fill="#8B949E">命令</text>
  <text x="928" y="610" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">通知仓库发货</text>

  <rect x="1032" y="552" width="160" height="96" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2"/>
  <text x="1112" y="578" text-anchor="middle" font-size="10" fill="#22D3EE">事件</text>
  <text x="1112" y="610" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">发货通知已发送</text>
  <circle cx="1184" cy="560" r="5" fill="#22D3EE" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 参与者：仓库管理员 -->
  <rect x="848" y="788" width="240" height="36" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="968" y="811" text-anchor="middle" font-size="12" fill="#8B949E">参与者 · 仓库管理员（接收发货通知）</text>

  <!-- 脚注 -->
  <text x="800" y="878" text-anchor="middle" font-size="10" fill="#8B949E">命名约定：命令 = 动宾结构（意图），事件 = 名词 + 已 + 动词（已发生的事实）；粉色脉冲点 = 分支中的失败/不足事件</text>
</svg>
