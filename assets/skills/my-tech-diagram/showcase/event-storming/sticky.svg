<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="stickyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#FAFAFA"/>

  <!-- 标题 -->
  <text x="48" y="52" font-size="22" font-weight="600" fill="#343A40">电商下单流程 · 事件风暴图</text>
  <text x="48" y="76" font-size="12" fill="#868E96">分组式领域事件图 · 便签风 · 黄 = 命令，绿 = 事件，粉条 = 分组；空间位置即关系，无连线</text>

  <!-- 图例 -->
  <g font-size="12" fill="#868E96">
    <rect x="1000" y="40" width="22" height="14" rx="2" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2"/>
    <text x="1030" y="51">命令</text>
    <rect x="1086" y="40" width="22" height="14" rx="2" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2"/>
    <text x="1116" y="51">事件</text>
    <rect x="1172" y="40" width="22" height="14" rx="2" fill="#FFF9DB" stroke="#B08C00" stroke-width="1.2"/>
    <text x="1202" y="51">参与者</text>
    <rect x="1268" y="40" width="22" height="14" rx="2" fill="#FCE4EC" stroke="#C2255C" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="1298" y="51">外部系统</text>
    <rect x="1376" y="40" width="22" height="14" rx="2" fill="#FCE4EC" stroke="#AD1457" stroke-width="1"/>
    <text x="1406" y="51">分组标题</text>
  </g>

  <!-- ========== 分组 1：订单 ========== -->
  <rect x="48" y="96" width="736" height="40" rx="4" fill="#FCE4EC" stroke="#AD1457" stroke-width="1" filter="url(#stickyShadow)"/>
  <text x="416" y="121" text-anchor="middle" font-size="15" font-weight="600" fill="#880E4F">订单</text>

  <!-- 行1：提交订单 → 订单已提交 -->
  <g transform="rotate(-0.7 160 208)">
    <rect x="80" y="160" width="160" height="96" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M226 160 h14 v14 z" fill="#E8B004" opacity="0.55"/>
    <text x="160" y="186" text-anchor="middle" font-size="10" fill="#868E96">命令</text>
    <text x="160" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">提交订单</text>
  </g>
  <g transform="rotate(0.6 344 208)">
    <rect x="264" y="160" width="160" height="96" rx="3" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M410 160 h14 v14 z" fill="#5C940D" opacity="0.55"/>
    <text x="344" y="186" text-anchor="middle" font-size="10" fill="#868E96">事件</text>
    <text x="344" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">订单已提交</text>
  </g>

  <!-- 行2：创建订单 → 订单已创建 / 订单创建失败 -->
  <g transform="rotate(0.8 160 328)">
    <rect x="80" y="280" width="160" height="96" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M226 280 h14 v14 z" fill="#E8B004" opacity="0.55"/>
    <text x="160" y="306" text-anchor="middle" font-size="10" fill="#868E96">命令</text>
    <text x="160" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">创建订单</text>
  </g>
  <g transform="rotate(-0.6 344 328)">
    <rect x="264" y="280" width="160" height="96" rx="3" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M410 280 h14 v14 z" fill="#5C940D" opacity="0.55"/>
    <text x="344" y="306" text-anchor="middle" font-size="10" fill="#868E96">事件</text>
    <text x="344" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">订单已创建</text>
  </g>
  <g transform="rotate(0.7 528 328)">
    <rect x="448" y="280" width="160" height="96" rx="3" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M594 280 h14 v14 z" fill="#5C940D" opacity="0.55"/>
    <text x="528" y="306" text-anchor="middle" font-size="10" fill="#868E96">事件</text>
    <text x="528" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">订单创建失败</text>
  </g>

  <!-- 参与者：买家 -->
  <g transform="rotate(-0.5 160 414)">
    <rect x="80" y="396" width="160" height="36" rx="3" fill="#FFF9DB" stroke="#B08C00" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M226 396 h14 v14 z" fill="#B08C00" opacity="0.45"/>
    <text x="160" y="419" text-anchor="middle" font-size="12" fill="#868E96">参与者 · 买家</text>
  </g>

  <!-- ========== 分组 2：库存 ========== -->
  <rect x="816" y="96" width="736" height="40" rx="4" fill="#FCE4EC" stroke="#AD1457" stroke-width="1" filter="url(#stickyShadow)"/>
  <text x="1184" y="121" text-anchor="middle" font-size="15" font-weight="600" fill="#880E4F">库存</text>

  <!-- 行1：校验库存 → 库存充足已确认 / 库存不足已确认 -->
  <g transform="rotate(0.6 928 208)">
    <rect x="848" y="160" width="160" height="96" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M994 160 h14 v14 z" fill="#E8B004" opacity="0.55"/>
    <text x="928" y="186" text-anchor="middle" font-size="10" fill="#868E96">命令</text>
    <text x="928" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">校验库存</text>
  </g>
  <g transform="rotate(-0.8 1112 208)">
    <rect x="1032" y="160" width="160" height="96" rx="3" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M1178 160 h14 v14 z" fill="#5C940D" opacity="0.55"/>
    <text x="1112" y="186" text-anchor="middle" font-size="10" fill="#868E96">事件</text>
    <text x="1112" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">库存充足已确认</text>
  </g>
  <g transform="rotate(0.7 1296 208)">
    <rect x="1216" y="160" width="160" height="96" rx="3" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M1362 160 h14 v14 z" fill="#5C940D" opacity="0.55"/>
    <text x="1296" y="186" text-anchor="middle" font-size="10" fill="#868E96">事件</text>
    <text x="1296" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">库存不足已确认</text>
  </g>

  <!-- 行2：扣减库存 → 库存已扣减 -->
  <g transform="rotate(-0.7 928 328)">
    <rect x="848" y="280" width="160" height="96" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M994 280 h14 v14 z" fill="#E8B004" opacity="0.55"/>
    <text x="928" y="306" text-anchor="middle" font-size="10" fill="#868E96">命令</text>
    <text x="928" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">扣减库存</text>
  </g>
  <g transform="rotate(0.8 1112 328)">
    <rect x="1032" y="280" width="160" height="96" rx="3" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M1178 280 h14 v14 z" fill="#5C940D" opacity="0.55"/>
    <text x="1112" y="306" text-anchor="middle" font-size="10" fill="#868E96">事件</text>
    <text x="1112" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">库存已扣减</text>
  </g>

  <!-- ========== 分组 3：支付 ========== -->
  <rect x="48" y="488" width="736" height="40" rx="4" fill="#FCE4EC" stroke="#AD1457" stroke-width="1" filter="url(#stickyShadow)"/>
  <text x="416" y="513" text-anchor="middle" font-size="15" font-weight="600" fill="#880E4F">支付</text>

  <!-- 行1：发起支付 → 支付已发起 -->
  <g transform="rotate(0.7 160 600)">
    <rect x="80" y="552" width="160" height="96" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M226 552 h14 v14 z" fill="#E8B004" opacity="0.55"/>
    <text x="160" y="578" text-anchor="middle" font-size="10" fill="#868E96">命令</text>
    <text x="160" y="610" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">发起支付</text>
  </g>
  <g transform="rotate(-0.6 344 600)">
    <rect x="264" y="552" width="160" height="96" rx="3" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M410 552 h14 v14 z" fill="#5C940D" opacity="0.55"/>
    <text x="344" y="578" text-anchor="middle" font-size="10" fill="#868E96">事件</text>
    <text x="344" y="610" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">支付已发起</text>
  </g>

  <!-- 行2：支付宝（外部系统） → 支付已成功 -->
  <g transform="rotate(-0.8 160 720)">
    <rect x="80" y="672" width="160" height="96" rx="3" fill="#FCE4EC" stroke="#C2255C" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#stickyShadow)"/>
    <path d="M226 672 h14 v14 z" fill="#C2255C" opacity="0.45"/>
    <text x="160" y="698" text-anchor="middle" font-size="10" fill="#868E96">外部系统</text>
    <text x="160" y="730" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">支付宝</text>
  </g>
  <g transform="rotate(0.6 344 720)">
    <rect x="264" y="672" width="160" height="96" rx="3" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M410 672 h14 v14 z" fill="#5C940D" opacity="0.55"/>
    <text x="344" y="698" text-anchor="middle" font-size="10" fill="#868E96">事件</text>
    <text x="344" y="730" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">支付已成功</text>
  </g>

  <!-- ========== 分组 4：发货履约 ========== -->
  <rect x="816" y="488" width="736" height="40" rx="4" fill="#FCE4EC" stroke="#AD1457" stroke-width="1" filter="url(#stickyShadow)"/>
  <text x="1184" y="513" text-anchor="middle" font-size="15" font-weight="600" fill="#880E4F">发货履约</text>

  <!-- 行1：通知仓库发货 → 发货通知已发送 -->
  <g transform="rotate(-0.6 928 600)">
    <rect x="848" y="552" width="160" height="96" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M994 552 h14 v14 z" fill="#E8B004" opacity="0.55"/>
    <text x="928" y="578" text-anchor="middle" font-size="10" fill="#868E96">命令</text>
    <text x="928" y="610" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">通知仓库发货</text>
  </g>
  <g transform="rotate(0.8 1112 600)">
    <rect x="1032" y="552" width="160" height="96" rx="3" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M1178 552 h14 v14 z" fill="#5C940D" opacity="0.55"/>
    <text x="1112" y="578" text-anchor="middle" font-size="10" fill="#868E96">事件</text>
    <text x="1112" y="610" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">发货通知已发送</text>
  </g>

  <!-- 参与者：仓库管理员 -->
  <g transform="rotate(0.5 968 806)">
    <rect x="848" y="788" width="240" height="36" rx="3" fill="#FFF9DB" stroke="#B08C00" stroke-width="1.2" filter="url(#stickyShadow)"/>
    <path d="M1074 788 h14 v14 z" fill="#B08C00" opacity="0.45"/>
    <text x="968" y="811" text-anchor="middle" font-size="12" fill="#868E96">参与者 · 仓库管理员（接收发货通知）</text>
  </g>

  <!-- 脚注 -->
  <text x="800" y="878" text-anchor="middle" font-size="10" fill="#868E96">命名约定：命令 = 动宾结构（意图），事件 = 名词 + 已 + 动词（已发生的事实）；分支以「一个命令向右并列多个事件」表达</text>
</svg>
