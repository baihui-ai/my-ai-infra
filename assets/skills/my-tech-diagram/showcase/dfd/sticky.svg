<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868E96"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FAFAFA"/>

  <!-- 分组标题条（粉色） -->
  <rect x="48" y="32" width="420" height="44" rx="4" fill="#FCE4EC" stroke="#AD1457" stroke-width="1"/>
  <text x="258" y="60" text-anchor="middle" font-size="16" font-weight="600" fill="#880E4F">订单处理数据流图 · DFD Level 0</text>

  <!-- ========== 数据流（灰色直箭头，压在便签下层） ========== -->
  <!-- F1 买家 → 订单处理：订单数据 -->
  <line x1="240" y1="332" x2="482" y2="332" stroke="#868E96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="361" y="318" text-anchor="middle" font-size="12" fill="#868E96">订单数据</text>

  <!-- F4 订单处理 → 支付网关：支付指令 -->
  <line x1="638" y1="332" x2="878" y2="332" stroke="#868E96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="758" y="318" text-anchor="middle" font-size="12" fill="#868E96">支付指令</text>

  <!-- F2 订单处理 → 订单库：订单记录（折线：下 → 右 → 下） -->
  <path d="M 614 388 V 480 H 920 V 528" fill="none" stroke="#868E96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="767" y="470" text-anchor="middle" font-size="12" fill="#868E96">订单记录</text>

  <!-- F3 库存库 → 订单处理：库存信息（折线：上 → 右 → 上） -->
  <path d="M 240 528 V 440 H 506 V 390" fill="none" stroke="#868E96" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="373" y="430" text-anchor="middle" font-size="12" fill="#868E96">库存信息</text>

  <!-- ========== 节点（便签 + 折角，Yourdon 形状保留） ========== -->
  <!-- 外部实体：买家（粉丝虚线边便签） -->
  <g transform="rotate(-0.8 160 332)">
    <rect x="80" y="300" width="160" height="64" rx="3" fill="#FCE4EC" stroke="#C2255C" stroke-width="1.2" stroke-dasharray="5 3"/>
    <path d="M 226 300 h 14 v 14 z" fill="#C2255C" opacity="0.55"/>
    <text x="160" y="324" text-anchor="middle" font-size="10" fill="#868E96">外部实体</text>
    <text x="160" y="346" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">买家</text>
  </g>

  <!-- 加工：1.0 订单处理（黄色圆形便签） -->
  <circle cx="560" cy="332" r="76" fill="#FFF3BF" stroke="#E8B004" stroke-width="2"/>
  <text x="560" y="314" text-anchor="middle" font-size="10" fill="#868E96">加工</text>
  <text x="560" y="334" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">1.0 订单处理</text>

  <!-- 外部实体：支付网关（粉丝虚线边便签） -->
  <g transform="rotate(0.7 960 332)">
    <rect x="880" y="300" width="160" height="64" rx="3" fill="#FCE4EC" stroke="#C2255C" stroke-width="1.2" stroke-dasharray="5 3"/>
    <path d="M 1026 300 h 14 v 14 z" fill="#C2255C" opacity="0.55"/>
    <text x="960" y="324" text-anchor="middle" font-size="10" fill="#868E96">外部实体</text>
    <text x="960" y="346" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">支付网关</text>
  </g>

  <!-- 数据存储：D2 库存库（绿色开口矩形便签） -->
  <g transform="rotate(0.6 240 560)">
    <path d="M 360 532 H 120 V 588 H 360" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2"/>
    <path d="M 346 532 h 14 v 14 z" fill="#5C940D" opacity="0.55"/>
    <line x1="160" y1="532" x2="160" y2="588" stroke="#5C940D" stroke-width="1.2"/>
    <text x="140" y="565" text-anchor="middle" font-size="11" fill="#5C940D">D2</text>
    <text x="262" y="554" text-anchor="middle" font-size="10" fill="#868E96">数据存储</text>
    <text x="262" y="574" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">库存库</text>
  </g>

  <!-- 数据存储：D1 订单库（绿色开口矩形便签） -->
  <g transform="rotate(-0.6 920 560)">
    <path d="M 1040 532 H 800 V 588 H 1040" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2"/>
    <path d="M 1026 532 h 14 v 14 z" fill="#5C940D" opacity="0.55"/>
    <line x1="840" y1="532" x2="840" y2="588" stroke="#5C940D" stroke-width="1.2"/>
    <text x="820" y="565" text-anchor="middle" font-size="11" fill="#5C940D">D1</text>
    <text x="942" y="554" text-anchor="middle" font-size="10" fill="#868E96">数据存储</text>
    <text x="942" y="574" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">订单库</text>
  </g>

  <!-- ========== 图例 ========== -->
  <g>
    <rect x="48" y="636" width="24" height="16" rx="3" fill="#FCE4EC" stroke="#C2255C" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="80" y="649" font-size="10" fill="#868E96">外部实体</text>
    <circle cx="160" cy="644" r="9" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.5"/>
    <text x="176" y="649" font-size="10" fill="#868E96">加工</text>
    <path d="M 252 636 H 228 V 652 H 252" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2"/>
    <text x="260" y="649" font-size="10" fill="#868E96">数据存储</text>
    <line x1="330" y1="644" x2="366" y2="644" stroke="#868E96" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="374" y="649" font-size="10" fill="#868E96">数据流（标签 = 数据名）</text>
  </g>
</svg>
