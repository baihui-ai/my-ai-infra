<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97757"/>
    </marker>
    <marker id="arrWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9BFAE"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#F5F1EA"/>

  <!-- 标题（衬线） -->
  <text x="48" y="52" font-size="20" font-weight="600" fill="#2B2118" font-family="Georgia, 'Times New Roman', 'Songti SC', 'SimSun', serif">订单状态图</text>

  <!-- ============ 主流程（横向，y=300）============ -->
  <!-- 初态 -->
  <circle cx="128" cy="300" r="10" fill="#2B2118"/>
  <line x1="140" y1="300" x2="198" y2="300" stroke="#D97757" stroke-width="2" marker-end="url(#arrOrange)"/>

  <!-- 待支付 -->
  <rect x="200" y="272" width="160" height="56" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
  <rect x="202" y="272" width="156" height="3" rx="1.5" fill="#D97757"/>
  <text x="280" y="300" text-anchor="middle" font-size="14" font-weight="500" fill="#2B2118" dy="0.35em">待支付</text>

  <!-- 待发货 -->
  <rect x="440" y="272" width="160" height="56" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
  <rect x="442" y="272" width="156" height="3" rx="1.5" fill="#D97757"/>
  <text x="520" y="300" text-anchor="middle" font-size="14" font-weight="500" fill="#2B2118" dy="0.35em">待发货</text>

  <!-- 已发货 -->
  <rect x="680" y="272" width="160" height="56" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
  <rect x="682" y="272" width="156" height="3" rx="1.5" fill="#D97757"/>
  <text x="760" y="300" text-anchor="middle" font-size="14" font-weight="500" fill="#2B2118" dy="0.35em">已发货</text>

  <!-- 已完成（终态，双线边框，主流程终点高亮） -->
  <rect x="920" y="272" width="160" height="56" rx="10" fill="#F9E5DB" stroke="#D97757" stroke-width="1.5"/>
  <rect x="924" y="276" width="152" height="48" rx="7" fill="none" stroke="#EAC4B2" stroke-width="1"/>
  <text x="1000" y="300" text-anchor="middle" font-size="14" font-weight="500" fill="#C2542F" dy="0.35em">已完成</text>

  <!-- 主流程转换 -->
  <line x1="360" y1="300" x2="438" y2="300" stroke="#D97757" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="400" y="288" text-anchor="middle" font-size="11" fill="#8A7B6B">支付成功</text>

  <line x1="600" y1="300" x2="678" y2="300" stroke="#D97757" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="640" y="288" text-anchor="middle" font-size="11" fill="#8A7B6B">发货</text>

  <line x1="840" y1="300" x2="918" y2="300" stroke="#D97757" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="880" y="288" text-anchor="middle" font-size="11" fill="#8A7B6B">确认收货</text>

  <!-- ============ 异常/取消路径（下方一行，y=528）============ -->
  <!-- 已取消（终态，双线边框） -->
  <rect x="200" y="500" width="160" height="56" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
  <rect x="204" y="504" width="152" height="48" rx="7" fill="none" stroke="#E3DCD0" stroke-width="1"/>
  <text x="280" y="528" text-anchor="middle" font-size="14" font-weight="500" fill="#2B2118" dy="0.35em">已取消</text>

  <!-- 退款中 -->
  <rect x="680" y="500" width="160" height="56" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
  <text x="760" y="528" text-anchor="middle" font-size="14" font-weight="500" fill="#2B2118" dy="0.35em">退款中</text>

  <!-- 已关闭（终态，双线边框） -->
  <rect x="920" y="500" width="160" height="56" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
  <rect x="924" y="504" width="152" height="48" rx="7" fill="none" stroke="#E3DCD0" stroke-width="1"/>
  <text x="1000" y="528" text-anchor="middle" font-size="14" font-weight="500" fill="#2B2118" dy="0.35em">已关闭</text>

  <!-- 异常路径转换 -->
  <line x1="280" y1="328" x2="280" y2="498" stroke="#C9BFAE" stroke-width="1.5" marker-end="url(#arrWarm)"/>
  <text x="325" y="418" text-anchor="middle" font-size="11" fill="#8A7B6B">超时取消</text>

  <line x1="760" y1="328" x2="760" y2="498" stroke="#C9BFAE" stroke-width="1.5" marker-end="url(#arrWarm)"/>
  <text x="805" y="418" text-anchor="middle" font-size="11" fill="#8A7B6B">申请退款</text>

  <line x1="840" y1="528" x2="918" y2="528" stroke="#C9BFAE" stroke-width="1.5" marker-end="url(#arrWarm)"/>
  <text x="880" y="516" text-anchor="middle" font-size="11" fill="#8A7B6B">退款成功</text>

  <!-- ============ 图例 ============ -->
  <g font-size="10" fill="#8A7B6B">
    <circle cx="56" cy="616" r="5" fill="#2B2118"/>
    <text x="68" y="620">初态</text>

    <rect x="120" y="608" width="28" height="16" rx="4" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
    <text x="156" y="620">状态</text>

    <rect x="200" y="608" width="28" height="16" rx="4" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
    <rect x="203" y="611" width="22" height="10" rx="2" fill="none" stroke="#E3DCD0" stroke-width="1"/>
    <text x="236" y="620">终态</text>

    <line x1="280" y1="616" x2="318" y2="616" stroke="#D97757" stroke-width="2" marker-end="url(#arrOrange)"/>
    <text x="326" y="620">主流程</text>

    <line x1="386" y1="616" x2="424" y2="616" stroke="#C9BFAE" stroke-width="1.5" marker-end="url(#arrWarm)"/>
    <text x="432" y="620">异常/取消路径</text>
  </g>
</svg>
