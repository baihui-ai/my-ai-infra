<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#1C2330" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#0D1117"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="48" y="52" font-size="20" font-weight="600" fill="#E6EDF3">订单状态图</text>

  <!-- ============ 主流程（横向，y=300）============ -->
  <!-- 初态 -->
  <circle cx="128" cy="300" r="10" fill="#E6EDF3"/>
  <line x1="140" y1="300" x2="198" y2="300" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrCyan)"/>

  <!-- 待支付 -->
  <rect x="200" y="272" width="160" height="56" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="280" y="300" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3" dy="0.35em">待支付</text>

  <!-- 待发货 -->
  <rect x="440" y="272" width="160" height="56" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="520" y="300" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3" dy="0.35em">待发货</text>

  <!-- 已发货 -->
  <rect x="680" y="272" width="160" height="56" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="760" y="300" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3" dy="0.35em">已发货</text>

  <!-- 已完成（终态，双线边框，主流程终点霓虹高亮 + glow） -->
  <rect x="920" y="272" width="160" height="56" rx="10" fill="#122630" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
  <rect x="924" y="276" width="152" height="48" rx="7" fill="none" stroke="#164E63" stroke-width="1"/>
  <text x="1000" y="300" text-anchor="middle" font-size="14" font-weight="500" fill="#22D3EE" dy="0.35em">已完成</text>

  <!-- 主流程转换 -->
  <line x1="360" y1="300" x2="438" y2="300" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="400" y="288" text-anchor="middle" font-size="11" fill="#8B949E">支付成功</text>

  <line x1="600" y1="300" x2="678" y2="300" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="640" y="288" text-anchor="middle" font-size="11" fill="#8B949E">发货</text>

  <line x1="840" y1="300" x2="918" y2="300" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="880" y="288" text-anchor="middle" font-size="11" fill="#8B949E">确认收货</text>

  <!-- ============ 异常/取消路径（下方一行，y=528）============ -->
  <!-- 已取消（终态，双线边框） -->
  <rect x="200" y="500" width="160" height="56" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <rect x="204" y="504" width="152" height="48" rx="7" fill="none" stroke="#3D4450" stroke-width="1"/>
  <text x="280" y="528" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3" dy="0.35em">已取消</text>

  <!-- 退款中 -->
  <rect x="680" y="500" width="160" height="56" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="760" y="528" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3" dy="0.35em">退款中</text>

  <!-- 已关闭（终态，双线边框） -->
  <rect x="920" y="500" width="160" height="56" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <rect x="924" y="504" width="152" height="48" rx="7" fill="none" stroke="#3D4450" stroke-width="1"/>
  <text x="1000" y="528" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3" dy="0.35em">已关闭</text>

  <!-- 异常路径转换（紫色霓虹） -->
  <line x1="280" y1="328" x2="280" y2="498" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="325" y="418" text-anchor="middle" font-size="11" fill="#8B949E">超时取消</text>

  <line x1="760" y1="328" x2="760" y2="498" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="805" y="418" text-anchor="middle" font-size="11" fill="#8B949E">申请退款</text>

  <line x1="840" y1="528" x2="918" y2="528" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="880" y="516" text-anchor="middle" font-size="11" fill="#8B949E">退款成功</text>

  <!-- ============ 图例 ============ -->
  <g font-size="10" fill="#8B949E">
    <circle cx="56" cy="616" r="5" fill="#E6EDF3"/>
    <text x="68" y="620">初态</text>

    <rect x="120" y="608" width="28" height="16" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="156" y="620">状态</text>

    <rect x="200" y="608" width="28" height="16" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="203" y="611" width="22" height="10" rx="2" fill="none" stroke="#3D4450" stroke-width="1"/>
    <text x="236" y="620">终态</text>

    <line x1="280" y1="616" x2="318" y2="616" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrCyan)"/>
    <text x="326" y="620">主流程</text>

    <line x1="386" y1="616" x2="424" y2="616" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrPurple)"/>
    <text x="432" y="620">异常/取消路径</text>
  </g>
</svg>
