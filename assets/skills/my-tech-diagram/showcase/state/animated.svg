<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="48" y="52" font-size="20" font-weight="600" fill="#1F2328">订单状态图</text>

  <!-- ============ 主流程（横向，y=300）============ -->
  <!-- 初态 -->
  <circle cx="128" cy="300" r="10" fill="#1F2328"/>
  <line x1="140" y1="300" x2="198" y2="300" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrBlue)">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- 待支付 -->
  <rect x="200" y="272" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="280" y="300" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328" dy="0.35em">待支付</text>

  <!-- 待发货（当前态：脉冲圆环 + 徽标） -->
  <circle cx="520" cy="300" r="54" fill="none" stroke="#2563EB" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="54;82" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <rect x="440" y="272" width="160" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="520" y="300" text-anchor="middle" font-size="14" font-weight="500" fill="#2563EB" dy="0.35em">待发货</text>
  <rect x="544" y="256" width="56" height="20" rx="10" fill="#2563EB"/>
  <text x="572" y="266" text-anchor="middle" font-size="10" fill="#FFFFFF" dy="0.35em">当前态</text>

  <!-- 已发货 -->
  <rect x="680" y="272" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="760" y="300" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328" dy="0.35em">已发货</text>

  <!-- 已完成（终态，双线边框） -->
  <rect x="920" y="272" width="160" height="56" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="924" y="276" width="152" height="48" rx="5" fill="none" stroke="#D1D5DB" stroke-width="1"/>
  <text x="1000" y="300" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328" dy="0.35em">已完成</text>

  <!-- 主流程转换（虚线流动） -->
  <line x1="360" y1="300" x2="438" y2="300" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrBlue)">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <text x="400" y="288" text-anchor="middle" font-size="11" fill="#6B7280">支付成功</text>

  <line x1="600" y1="300" x2="678" y2="300" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrBlue)">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <text x="640" y="288" text-anchor="middle" font-size="11" fill="#6B7280">发货</text>

  <line x1="840" y1="300" x2="918" y2="300" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrBlue)">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <text x="880" y="288" text-anchor="middle" font-size="11" fill="#6B7280">确认收货</text>

  <!-- ============ 异常/取消路径（下方一行，y=528）============ -->
  <!-- 已取消（终态，双线边框） -->
  <rect x="200" y="500" width="160" height="56" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="204" y="504" width="152" height="48" rx="5" fill="none" stroke="#D1D5DB" stroke-width="1"/>
  <text x="280" y="528" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328" dy="0.35em">已取消</text>

  <!-- 退款中 -->
  <rect x="680" y="500" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="760" y="528" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328" dy="0.35em">退款中</text>

  <!-- 已关闭（终态，双线边框） -->
  <rect x="920" y="500" width="160" height="56" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="924" y="504" width="152" height="48" rx="5" fill="none" stroke="#D1D5DB" stroke-width="1"/>
  <text x="1000" y="528" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328" dy="0.35em">已关闭</text>

  <!-- 异常路径转换 -->
  <line x1="280" y1="328" x2="280" y2="498" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="325" y="418" text-anchor="middle" font-size="11" fill="#6B7280">超时取消</text>

  <line x1="760" y1="328" x2="760" y2="498" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="805" y="418" text-anchor="middle" font-size="11" fill="#6B7280">申请退款</text>

  <line x1="840" y1="528" x2="918" y2="528" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="880" y="516" text-anchor="middle" font-size="11" fill="#6B7280">退款成功</text>

  <!-- ============ 图例 ============ -->
  <g font-size="10" fill="#6B7280">
    <circle cx="56" cy="616" r="5" fill="#1F2328"/>
    <text x="68" y="620">初态</text>

    <rect x="120" y="608" width="28" height="16" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="156" y="620">状态</text>

    <rect x="200" y="608" width="28" height="16" rx="4" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
    <rect x="203" y="611" width="22" height="10" rx="2" fill="none" stroke="#D1D5DB" stroke-width="1"/>
    <text x="236" y="620">终态</text>

    <line x1="280" y1="616" x2="318" y2="616" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrBlue)"/>
    <text x="326" y="620">主流程（流动）</text>

    <circle cx="430" cy="616" r="6" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.6"/>
    <text x="442" y="620">当前态脉冲</text>

    <line x1="510" y1="616" x2="548" y2="616" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrGray)"/>
    <text x="556" y="620">异常/取消路径</text>
  </g>
</svg>
