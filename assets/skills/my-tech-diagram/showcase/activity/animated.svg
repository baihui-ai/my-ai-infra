<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="76" y="44" font-size="20" font-weight="600" fill="#1F2328">报销审批流程 · UML 活动图</text>

  <!-- 泳道头部底色 -->
  <rect x="77" y="73" width="358" height="43" fill="#F9FAFB"/>
  <rect x="461" y="73" width="358" height="43" fill="#F9FAFB"/>
  <rect x="845" y="73" width="358" height="43" fill="#F9FAFB"/>

  <!-- 泳道边框 -->
  <rect x="76" y="72" width="360" height="616" rx="8" fill="none" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="460" y="72" width="360" height="616" rx="8" fill="none" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="844" y="72" width="360" height="616" rx="8" fill="none" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- 泳道头部分隔线 -->
  <line x1="77" y1="116" x2="435" y2="116" stroke="#D1D5DB" stroke-width="1"/>
  <line x1="461" y1="116" x2="819" y2="116" stroke="#D1D5DB" stroke-width="1"/>
  <line x1="845" y1="116" x2="1203" y2="116" stroke="#D1D5DB" stroke-width="1"/>

  <!-- 泳道名 -->
  <text x="256" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">申请人</text>
  <text x="640" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">主管</text>
  <text x="1024" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">财务</text>

  <!-- 主流程：虚线流动（SMIL 动画 stroke-dashoffset） -->
  <!-- 边 1：start → submit -->
  <line x1="256" y1="169" x2="256" y2="196" stroke="#2563EB" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrBlue)">
    <animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <!-- 边 2：submit → 主管审批 -->
  <line x1="350" y1="228" x2="550" y2="228" stroke="#2563EB" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrBlue)">
    <animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <!-- 边 3：主管审批 → 财务复核 [通过] -->
  <line x1="730" y1="228" x2="934" y2="228" stroke="#2563EB" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrBlue)">
    <animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <text x="832" y="216" text-anchor="middle" font-size="11" fill="#2563EB">[通过]</text>
  <!-- 边 4：财务复核 → 打款 [通过] -->
  <line x1="1024" y1="276" x2="1024" y2="332" stroke="#2563EB" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrBlue)">
    <animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <text x="1036" y="310" font-size="11" fill="#2563EB">[通过]</text>
  <!-- 边 5：打款 → end-pay -->
  <line x1="1024" y1="400" x2="1024" y2="448" stroke="#2563EB" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrBlue)">
    <animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- 边 6：主管审批 [驳回] → notify（静态，回流不动画） -->
  <path d="M 640 276 V 456 H 352" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="650" y="300" font-size="11" fill="#6B7280">[驳回]</text>

  <!-- 边 7：财务复核 [驳回] → notify（右缘 → 下缘 → 左缘外侧通道，零交叉） -->
  <path d="M 1112 228 H 1190 V 640 H 140 V 456 H 162" fill="none" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="1151" y="216" text-anchor="middle" font-size="11" fill="#6B7280">[驳回]</text>

  <!-- 边 8：notify → end-reject -->
  <line x1="256" y1="488" x2="256" y2="538" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- start：脉冲心跳 -->
  <circle cx="256" cy="158" r="9" fill="none" stroke="#2563EB" stroke-width="1.5">
    <animate attributeName="r" values="9;16" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="158" r="9" fill="#1F2328"/>
  <text x="256" y="140" text-anchor="middle" font-size="10" fill="#6B7280">开始</text>

  <!-- submit：Action 提交报销单 -->
  <rect x="166" y="200" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="256" y="220" text-anchor="middle" font-size="10" fill="#6B7280">动作</text>
  <text x="256" y="240" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">提交报销单</text>

  <!-- mgr-decide：Decision 主管审批 -->
  <polygon points="640,184 724,228 640,272 556,228" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="640" y="226" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">主管审批</text>
  <text x="640" y="244" text-anchor="middle" font-size="10" fill="#6B7280">决策</text>

  <!-- fin-decide：Decision 财务复核 -->
  <polygon points="1024,184 1108,228 1024,272 940,228" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1024" y="226" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">财务复核</text>
  <text x="1024" y="244" text-anchor="middle" font-size="10" fill="#6B7280">决策</text>

  <!-- pay：Action 打款 -->
  <rect x="934" y="340" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="1024" y="360" text-anchor="middle" font-size="10" fill="#6B7280">动作</text>
  <text x="1024" y="380" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">打款</text>

  <!-- end-pay -->
  <circle cx="1024" cy="462" r="12" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/>
  <circle cx="1024" cy="462" r="6" fill="#1F2328"/>
  <text x="1044" y="466" font-size="10" fill="#6B7280">结束</text>

  <!-- notify：Action 通知申请人 -->
  <rect x="166" y="428" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="256" y="448" text-anchor="middle" font-size="10" fill="#6B7280">动作</text>
  <text x="256" y="468" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">通知申请人</text>

  <!-- end-reject -->
  <circle cx="256" cy="552" r="12" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/>
  <circle cx="256" cy="552" r="6" fill="#1F2328"/>
  <text x="256" y="582" text-anchor="middle" font-size="10" fill="#6B7280">结束</text>

  <!-- 图例 -->
  <line x1="76" y1="706" x2="106" y2="706" stroke="#2563EB" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrBlue)"/>
  <text x="112" y="710" font-size="10" fill="#6B7280">主流程（虚线流动 = 进行中方向）</text>
  <line x1="292" y1="706" x2="322" y2="706" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="328" y="710" font-size="10" fill="#6B7280">驳回回流（走画布外侧通道，不与主流程交叉）</text>
  <text x="620" y="710" font-size="10" fill="#6B7280">[条件] = 决策守卫</text>
</svg>
