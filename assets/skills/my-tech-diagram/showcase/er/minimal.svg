<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="180" y="58" font-size="20" font-weight="600" fill="#1F2328">ER Diagram — Order Domain</text>
  <text x="180" y="80" font-size="12" fill="#6B7280">Crow's Foot notation · 4 entities · 3 relationships</text>

  <!-- ========== 关系线（先画线，符号与实体后画压住端点） ========== -->
  <!-- users — orders（y=206） -->
  <line x1="438" y1="206" x2="790" y2="206" stroke="#9CA3AF" stroke-width="1.5"/>
  <!-- orders — order_items（x=940） -->
  <line x1="940" y1="306" x2="940" y2="419" stroke="#9CA3AF" stroke-width="1.5"/>
  <!-- products — order_items（y=542） -->
  <line x1="438" y1="542" x2="790" y2="542" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- ========== Crow's Foot 端点符号 ========== -->
  <g stroke="#4B5563" stroke-width="1.5" fill="none">
    <!-- users 端 || (exactly one) -->
    <line x1="428" y1="198" x2="428" y2="214"/>
    <line x1="436" y1="198" x2="436" y2="214"/>
    <!-- orders 端 O< (zero or many)：圆 + 三爪 -->
    <circle cx="795" cy="206" r="5" fill="#FFFFFF"/>
    <path d="M 802 206 L 820 196 M 802 206 L 820 206 M 802 206 L 820 216"/>
    <!-- orders 端 ||（垂直线，横杠） -->
    <line x1="932" y1="296" x2="948" y2="296"/>
    <line x1="932" y1="304" x2="948" y2="304"/>
    <!-- order_items 上端 O< -->
    <circle cx="940" cy="425" r="5" fill="#FFFFFF"/>
    <path d="M 940 436 L 930 460 M 940 436 L 940 460 M 940 436 L 950 460"/>
    <!-- products 端 || -->
    <line x1="428" y1="534" x2="428" y2="550"/>
    <line x1="436" y1="534" x2="436" y2="550"/>
    <!-- order_items 左端 O< -->
    <circle cx="795" cy="542" r="5" fill="#FFFFFF"/>
    <path d="M 802 542 L 820 532 M 802 542 L 820 542 M 802 542 L 820 552"/>
  </g>

  <!-- 关系动词标签 -->
  <text x="620" y="190" text-anchor="middle" font-size="11" fill="#6B7280">places</text>
  <text x="956" y="378" text-anchor="start" font-size="11" fill="#6B7280">contains</text>
  <text x="620" y="526" text-anchor="middle" font-size="11" fill="#6B7280">appears in</text>

  <!-- ========== 实体：users（x=180, y=140, w=240, h=134） ========== -->
  <g>
    <rect x="180" y="140" width="240" height="134" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <path d="M 180 184 L 180 148 Q 180 140 188 140 L 412 140 Q 420 140 420 148 L 420 184 Z" fill="#F9FAFB"/>
    <text x="300" y="155" text-anchor="middle" font-size="10" fill="#6B7280">«entity»</text>
    <text x="300" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">users</text>
    <line x1="180" y1="184" x2="420" y2="184" stroke="#D1D5DB" stroke-width="1"/>
    <line x1="181" y1="214" x2="419" y2="214" stroke="#F3F4F6" stroke-width="1"/>
    <line x1="181" y1="244" x2="419" y2="244" stroke="#F3F4F6" stroke-width="1"/>
    <text x="196" y="204" text-anchor="start" font-size="13" font-weight="500" fill="#1F2328" text-decoration="underline">id</text>
    <text x="404" y="203" text-anchor="end" font-size="10" font-weight="600" fill="#2563EB">PK</text>
    <text x="196" y="234" text-anchor="start" font-size="13" fill="#1F2328">name</text>
    <text x="196" y="264" text-anchor="start" font-size="13" fill="#1F2328">email</text>
  </g>

  <!-- ========== 实体：orders（x=820, y=124, w=240, h=164） ========== -->
  <g>
    <rect x="820" y="124" width="240" height="164" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <path d="M 820 168 L 820 132 Q 820 124 828 124 L 1052 124 Q 1060 124 1060 132 L 1060 168 Z" fill="#F9FAFB"/>
    <text x="940" y="139" text-anchor="middle" font-size="10" fill="#6B7280">«entity»</text>
    <text x="940" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">orders</text>
    <line x1="820" y1="168" x2="1060" y2="168" stroke="#D1D5DB" stroke-width="1"/>
    <line x1="821" y1="198" x2="1059" y2="198" stroke="#F3F4F6" stroke-width="1"/>
    <line x1="821" y1="228" x2="1059" y2="228" stroke="#F3F4F6" stroke-width="1"/>
    <line x1="821" y1="258" x2="1059" y2="258" stroke="#F3F4F6" stroke-width="1"/>
    <text x="836" y="188" text-anchor="start" font-size="13" font-weight="500" fill="#1F2328" text-decoration="underline">id</text>
    <text x="1044" y="187" text-anchor="end" font-size="10" font-weight="600" fill="#2563EB">PK</text>
    <text x="836" y="218" text-anchor="start" font-size="13" fill="#1F2328">user_id</text>
    <text x="1044" y="217" text-anchor="end" font-size="10" font-weight="600" fill="#2563EB">FK</text>
    <text x="836" y="248" text-anchor="start" font-size="13" fill="#1F2328">status</text>
    <text x="836" y="278" text-anchor="start" font-size="13" fill="#1F2328">created_at</text>
  </g>

  <!-- ========== 实体：order_items（x=820, y=460, w=240, h=164） ========== -->
  <g>
    <rect x="820" y="460" width="240" height="164" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <path d="M 820 504 L 820 468 Q 820 460 828 460 L 1052 460 Q 1060 460 1060 468 L 1060 504 Z" fill="#F9FAFB"/>
    <text x="940" y="475" text-anchor="middle" font-size="10" fill="#6B7280">«entity»</text>
    <text x="940" y="492" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">order_items</text>
    <line x1="820" y1="504" x2="1060" y2="504" stroke="#D1D5DB" stroke-width="1"/>
    <line x1="821" y1="534" x2="1059" y2="534" stroke="#F3F4F6" stroke-width="1"/>
    <line x1="821" y1="564" x2="1059" y2="564" stroke="#F3F4F6" stroke-width="1"/>
    <line x1="821" y1="594" x2="1059" y2="594" stroke="#F3F4F6" stroke-width="1"/>
    <text x="836" y="524" text-anchor="start" font-size="13" font-weight="500" fill="#1F2328" text-decoration="underline">id</text>
    <text x="1044" y="523" text-anchor="end" font-size="10" font-weight="600" fill="#2563EB">PK</text>
    <text x="836" y="554" text-anchor="start" font-size="13" fill="#1F2328">order_id</text>
    <text x="1044" y="553" text-anchor="end" font-size="10" font-weight="600" fill="#2563EB">FK</text>
    <text x="836" y="584" text-anchor="start" font-size="13" fill="#1F2328">product_id</text>
    <text x="1044" y="583" text-anchor="end" font-size="10" font-weight="600" fill="#2563EB">FK</text>
    <text x="836" y="614" text-anchor="start" font-size="13" fill="#1F2328">quantity</text>
  </g>

  <!-- ========== 实体：products（x=180, y=476, w=240, h=134） ========== -->
  <g>
    <rect x="180" y="476" width="240" height="134" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <path d="M 180 520 L 180 484 Q 180 476 188 476 L 412 476 Q 420 476 420 484 L 420 520 Z" fill="#F9FAFB"/>
    <text x="300" y="491" text-anchor="middle" font-size="10" fill="#6B7280">«entity»</text>
    <text x="300" y="508" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">products</text>
    <line x1="180" y1="520" x2="420" y2="520" stroke="#D1D5DB" stroke-width="1"/>
    <line x1="181" y1="550" x2="419" y2="550" stroke="#F3F4F6" stroke-width="1"/>
    <line x1="181" y1="580" x2="419" y2="580" stroke="#F3F4F6" stroke-width="1"/>
    <text x="196" y="540" text-anchor="start" font-size="13" font-weight="500" fill="#1F2328" text-decoration="underline">id</text>
    <text x="404" y="539" text-anchor="end" font-size="10" font-weight="600" fill="#2563EB">PK</text>
    <text x="196" y="570" text-anchor="start" font-size="13" fill="#1F2328">name</text>
    <text x="196" y="600" text-anchor="start" font-size="13" fill="#1F2328">price</text>
  </g>

  <!-- ========== 图例（底部） ========== -->
  <g>
    <g stroke="#4B5563" stroke-width="1.5" fill="none">
      <line x1="180" y1="670" x2="180" y2="686"/>
      <line x1="188" y1="670" x2="188" y2="686"/>
      <circle cx="352" cy="678" r="4" fill="#FFFFFF"/>
      <path d="M 359 678 L 372 670 M 359 678 L 372 678 M 359 678 L 372 686"/>
    </g>
    <text x="200" y="682" text-anchor="start" font-size="11" fill="#6B7280">exactly one</text>
    <text x="384" y="682" text-anchor="start" font-size="11" fill="#6B7280">zero or many</text>
    <text x="560" y="682" text-anchor="start" font-size="11" fill="#6B7280"><tspan font-weight="600" fill="#2563EB">PK</tspan> = Primary Key</text>
    <text x="720" y="682" text-anchor="start" font-size="11" fill="#6B7280"><tspan font-weight="600" fill="#2563EB">FK</tspan> = Foreign Key</text>
  </g>
</svg>
