<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <rect width="1280" height="720" fill="#FAFAFA"/>

  <!-- 标题 -->
  <text x="180" y="58" font-size="20" font-weight="600" fill="#343A40">ER Diagram — Order Domain</text>
  <text x="180" y="80" font-size="12" fill="#868E96">Crow's Foot notation · 4 entities · 3 relationships</text>

  <!-- ========== 关系线 ========== -->
  <line x1="438" y1="206" x2="790" y2="206" stroke="#ADB5BD" stroke-width="1.5"/>
  <line x1="940" y1="306" x2="940" y2="419" stroke="#ADB5BD" stroke-width="1.5"/>
  <line x1="438" y1="542" x2="790" y2="542" stroke="#ADB5BD" stroke-width="1.5"/>

  <!-- ========== Crow's Foot 端点符号 ========== -->
  <g stroke="#495057" stroke-width="1.5" fill="none">
    <line x1="428" y1="198" x2="428" y2="214"/>
    <line x1="436" y1="198" x2="436" y2="214"/>
    <circle cx="795" cy="206" r="5" fill="#FAFAFA"/>
    <path d="M 802 206 L 820 196 M 802 206 L 820 206 M 802 206 L 820 216"/>
    <line x1="932" y1="296" x2="948" y2="296"/>
    <line x1="932" y1="304" x2="948" y2="304"/>
    <circle cx="940" cy="425" r="5" fill="#FAFAFA"/>
    <path d="M 940 436 L 930 460 M 940 436 L 940 460 M 940 436 L 950 460"/>
    <line x1="428" y1="534" x2="428" y2="550"/>
    <line x1="436" y1="534" x2="436" y2="550"/>
    <circle cx="795" cy="542" r="5" fill="#FAFAFA"/>
    <path d="M 802 542 L 820 532 M 802 542 L 820 542 M 802 542 L 820 552"/>
  </g>

  <!-- 关系动词标签 -->
  <text x="620" y="190" text-anchor="middle" font-size="11" fill="#868E96">places</text>
  <text x="956" y="378" text-anchor="start" font-size="11" fill="#868E96">contains</text>
  <text x="620" y="526" text-anchor="middle" font-size="11" fill="#868E96">appears in</text>

  <!-- ========== 实体便签：users（黄） ========== -->
  <g transform="rotate(-0.6 300 207)">
    <rect x="180" y="140" width="240" height="134" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2"/>
    <path d="M 406 140 h 14 v 14 z" fill="#E8B004" opacity="0.55"/>
    <text x="300" y="162" text-anchor="middle" font-size="10" fill="#868E96">«entity»</text>
    <text x="300" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">users</text>
    <line x1="192" y1="190" x2="408" y2="190" stroke="#E8B004" stroke-width="1" opacity="0.6"/>
    <text x="196" y="210" text-anchor="start" font-size="13" font-weight="500" fill="#343A40" text-decoration="underline">id</text>
    <text x="404" y="209" text-anchor="end" font-size="10" font-weight="600" fill="#AD1457">PK</text>
    <text x="196" y="238" text-anchor="start" font-size="13" fill="#343A40">name</text>
    <text x="196" y="264" text-anchor="start" font-size="13" fill="#343A40">email</text>
  </g>

  <!-- ========== 实体便签：orders（黄） ========== -->
  <g transform="rotate(0.5 940 206)">
    <rect x="820" y="124" width="240" height="164" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2"/>
    <path d="M 1032 124 h 14 v 14 z" fill="#E8B004" opacity="0.55"/>
    <text x="940" y="146" text-anchor="middle" font-size="10" fill="#868E96">«entity»</text>
    <text x="940" y="164" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">orders</text>
    <line x1="832" y1="174" x2="1048" y2="174" stroke="#E8B004" stroke-width="1" opacity="0.6"/>
    <text x="836" y="194" text-anchor="start" font-size="13" font-weight="500" fill="#343A40" text-decoration="underline">id</text>
    <text x="1044" y="193" text-anchor="end" font-size="10" font-weight="600" fill="#AD1457">PK</text>
    <text x="836" y="222" text-anchor="start" font-size="13" fill="#343A40">user_id</text>
    <text x="1044" y="221" text-anchor="end" font-size="10" font-weight="600" fill="#AD1457">FK</text>
    <text x="836" y="250" text-anchor="start" font-size="13" fill="#343A40">status</text>
    <text x="836" y="278" text-anchor="start" font-size="13" fill="#343A40">created_at</text>
  </g>

  <!-- ========== 实体便签：order_items（绿，关联表） ========== -->
  <g transform="rotate(-0.5 940 542)">
    <rect x="820" y="460" width="240" height="164" rx="3" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2"/>
    <path d="M 1032 460 h 14 v 14 z" fill="#5C940D" opacity="0.55"/>
    <text x="940" y="482" text-anchor="middle" font-size="10" fill="#868E96">«junction entity»</text>
    <text x="940" y="500" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">order_items</text>
    <line x1="832" y1="510" x2="1048" y2="510" stroke="#5C940D" stroke-width="1" opacity="0.6"/>
    <text x="836" y="530" text-anchor="start" font-size="13" font-weight="500" fill="#343A40" text-decoration="underline">id</text>
    <text x="1044" y="529" text-anchor="end" font-size="10" font-weight="600" fill="#AD1457">PK</text>
    <text x="836" y="558" text-anchor="start" font-size="13" fill="#343A40">order_id</text>
    <text x="1044" y="557" text-anchor="end" font-size="10" font-weight="600" fill="#AD1457">FK</text>
    <text x="836" y="586" text-anchor="start" font-size="13" fill="#343A40">product_id</text>
    <text x="1044" y="585" text-anchor="end" font-size="10" font-weight="600" fill="#AD1457">FK</text>
    <text x="836" y="614" text-anchor="start" font-size="13" fill="#343A40">quantity</text>
  </g>

  <!-- ========== 实体便签：products（黄） ========== -->
  <g transform="rotate(0.6 300 543)">
    <rect x="180" y="476" width="240" height="134" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2"/>
    <path d="M 406 476 h 14 v 14 z" fill="#E8B004" opacity="0.55"/>
    <text x="300" y="498" text-anchor="middle" font-size="10" fill="#868E96">«entity»</text>
    <text x="300" y="516" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">products</text>
    <line x1="192" y1="526" x2="408" y2="526" stroke="#E8B004" stroke-width="1" opacity="0.6"/>
    <text x="196" y="546" text-anchor="start" font-size="13" font-weight="500" fill="#343A40" text-decoration="underline">id</text>
    <text x="404" y="545" text-anchor="end" font-size="10" font-weight="600" fill="#AD1457">PK</text>
    <text x="196" y="574" text-anchor="start" font-size="13" fill="#343A40">name</text>
    <text x="196" y="600" text-anchor="start" font-size="13" fill="#343A40">price</text>
  </g>

  <!-- ========== 图例（底部） ========== -->
  <g>
    <g stroke="#495057" stroke-width="1.5" fill="none">
      <line x1="180" y1="670" x2="180" y2="686"/>
      <line x1="188" y1="670" x2="188" y2="686"/>
      <circle cx="352" cy="678" r="4" fill="#FAFAFA"/>
      <path d="M 359 678 L 372 670 M 359 678 L 372 678 M 359 678 L 372 686"/>
    </g>
    <text x="200" y="682" text-anchor="start" font-size="11" fill="#868E96">exactly one</text>
    <text x="384" y="682" text-anchor="start" font-size="11" fill="#868E96">zero or many</text>
    <text x="560" y="682" text-anchor="start" font-size="11" fill="#868E96"><tspan font-weight="600" fill="#AD1457">PK</tspan> = Primary Key</text>
    <text x="720" y="682" text-anchor="start" font-size="11" fill="#868E96"><tspan font-weight="600" fill="#AD1457">FK</tspan> = Foreign Key</text>
    <rect x="880" y="668" width="14" height="14" rx="2" fill="#FFF3BF" stroke="#E8B004"/>
    <text x="900" y="679" text-anchor="start" font-size="11" fill="#868E96">entity</text>
    <rect x="960" y="668" width="14" height="14" rx="2" fill="#D3F9D8" stroke="#5C940D"/>
    <text x="980" y="679" text-anchor="start" font-size="11" fill="#868E96">junction</text>
  </g>
</svg>
