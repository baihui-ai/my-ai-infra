<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#868E96"/>
    </marker>
    <filter id="noteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FAFAFA"/>

  <!-- 标题 -->
  <text x="60" y="76" font-size="24" font-weight="600" fill="#343A40">2026 下半年 Roadmap</text>
  <text x="60" y="102" font-size="12" fill="#868E96">Q3 – Q4 2026 · 产品路线图 · 主题级视图</text>

  <!-- 季度分组标题条（便签风粉色分组头） -->
  <rect x="240" y="126" width="300" height="40" rx="4" fill="#FCE4EC" stroke="#AD1457" stroke-width="1"/>
  <text x="390" y="151" text-anchor="middle" font-size="15" font-weight="600" fill="#880E4F">Q3 2026</text>
  <rect x="740" y="126" width="300" height="40" rx="4" fill="#FCE4EC" stroke="#AD1457" stroke-width="1"/>
  <text x="890" y="151" text-anchor="middle" font-size="15" font-weight="600" fill="#880E4F">Q4 2026</text>

  <!-- 里程碑标注（时间轴上方） -->
  <text x="640" y="182" text-anchor="middle" font-size="10" fill="#868E96">里程碑</text>
  <text x="640" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#AD1457">9月 · 搜索 2.0 上线</text>
  <text x="1128" y="182" text-anchor="end" font-size="10" fill="#868E96">里程碑</text>
  <text x="1128" y="200" text-anchor="end" font-size="13" font-weight="600" fill="#AD1457">12月 · AI 助手 Beta</text>

  <!-- 时间轴 -->
  <line x1="140" y1="250" x2="1128" y2="250" stroke="#ADB5BD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 月份刻度与标签 -->
  <g stroke="#ADB5BD" stroke-width="1.5">
    <line x1="140" y1="244" x2="140" y2="256"/>
    <line x1="307" y1="244" x2="307" y2="256"/>
    <line x1="473" y1="244" x2="473" y2="256"/>
    <line x1="807" y1="244" x2="807" y2="256"/>
    <line x1="973" y1="244" x2="973" y2="256"/>
  </g>
  <g font-size="10" fill="#868E96" text-anchor="middle">
    <text x="140" y="276">7月</text>
    <text x="307" y="276">8月</text>
    <text x="473" y="276">9月</text>
    <text x="807" y="276">10月</text>
    <text x="973" y="276">11月</text>
    <text x="1128" y="276">12月</text>
  </g>

  <!-- 季度分隔虚线 -->
  <line x1="640" y1="118" x2="640" y2="560" stroke="#DEE2E6" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- 里程碑菱形：9月末（Q3 末） -->
  <path d="M640 239 L651 250 L640 261 L629 250 z" fill="#AD1457"/>
  <!-- 里程碑菱形：12月末（Q4 末） -->
  <path d="M1128 239 L1139 250 L1128 261 L1117 250 z" fill="#AD1457"/>

  <!-- 季度与便签的连接线 -->
  <line x1="390" y1="261" x2="390" y2="336" stroke="#CED4DA" stroke-width="1.5"/>
  <line x1="890" y1="261" x2="890" y2="336" stroke="#CED4DA" stroke-width="1.5"/>
  <line x1="390" y1="424" x2="390" y2="444" stroke="#CED4DA" stroke-width="1.5"/>
  <line x1="890" y1="424" x2="890" y2="444" stroke="#CED4DA" stroke-width="1.5"/>

  <!-- Q3 主题便签 1：搜索性能优化（黄） -->
  <g transform="rotate(-0.8 390 382)" filter="url(#noteShadow)">
    <rect x="290" y="340" width="200" height="88" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2"/>
    <path d="M476 340 h14 v14 z" fill="#E8B004" opacity="0.55"/>
    <text x="390" y="366" text-anchor="middle" font-size="10" fill="#868E96">Q3 · 主题</text>
    <text x="390" y="396" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">搜索性能优化</text>
  </g>

  <!-- Q3 主题便签 2：多语言扩展（黄） -->
  <g transform="rotate(0.7 390 492)" filter="url(#noteShadow)">
    <rect x="290" y="448" width="200" height="88" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2"/>
    <path d="M476 448 h14 v14 z" fill="#E8B004" opacity="0.55"/>
    <text x="390" y="474" text-anchor="middle" font-size="10" fill="#868E96">Q3 · 主题</text>
    <text x="390" y="504" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">多语言扩展</text>
  </g>

  <!-- Q4 主题便签 1：AI 导购助手（黄） -->
  <g transform="rotate(0.8 890 382)" filter="url(#noteShadow)">
    <rect x="790" y="340" width="200" height="88" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2"/>
    <path d="M976 340 h14 v14 z" fill="#E8B004" opacity="0.55"/>
    <text x="890" y="366" text-anchor="middle" font-size="10" fill="#868E96">Q4 · 主题</text>
    <text x="890" y="396" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">AI 导购助手</text>
  </g>

  <!-- Q4 主题便签 2：供应商门户（黄） -->
  <g transform="rotate(-0.7 890 492)" filter="url(#noteShadow)">
    <rect x="790" y="448" width="200" height="88" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2"/>
    <path d="M976 448 h14 v14 z" fill="#E8B004" opacity="0.55"/>
    <text x="890" y="474" text-anchor="middle" font-size="10" fill="#868E96">Q4 · 主题</text>
    <text x="890" y="504" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">供应商门户</text>
  </g>

  <!-- 图例 -->
  <g>
    <path d="M72 632 L80 640 L72 648 L64 640 z" fill="#AD1457"/>
    <text x="92" y="644" font-size="11" fill="#868E96">里程碑（零工期事件）</text>
    <rect x="222" y="630" width="22" height="18" rx="2" fill="#FFF3BF" stroke="#E8B004" stroke-width="1"/>
    <text x="254" y="644" font-size="11" fill="#868E96">主题条目（planned）</text>
  </g>

  <!-- 脚注 -->
  <text x="60" y="690" font-size="10" fill="#868E96">口径说明：条目粒度为主题，不含任务分解；里程碑时间精确到月（9 月末 / 12 月末）。</text>
</svg>
