<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="60" y="76" font-size="24" font-weight="600" fill="#1F2328">2026 下半年 Roadmap</text>
  <text x="60" y="102" font-size="12" fill="#6B7280">Q3 – Q4 2026 · 产品路线图 · 主题级视图</text>

  <!-- 季度标签（时间轴上方） -->
  <text x="390" y="152" text-anchor="middle" font-size="16" font-weight="600" fill="#1F2328">Q3 2026</text>
  <text x="890" y="152" text-anchor="middle" font-size="16" font-weight="600" fill="#1F2328">Q4 2026</text>

  <!-- 里程碑标注（时间轴上方） -->
  <text x="640" y="182" text-anchor="middle" font-size="10" fill="#6B7280">里程碑</text>
  <text x="640" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#2563EB">9月 · 搜索 2.0 上线</text>
  <text x="1128" y="182" text-anchor="end" font-size="10" fill="#6B7280">里程碑</text>
  <text x="1128" y="200" text-anchor="end" font-size="13" font-weight="600" fill="#2563EB">12月 · AI 助手 Beta</text>

  <!-- 时间轴（虚线流动：时间在流逝） -->
  <path id="timeline" d="M140 250 H1128" fill="none" stroke="#2563EB" stroke-width="1.5"
        stroke-dasharray="8 6" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <!-- 沿时间轴移动的时间光标 -->
  <circle r="4" fill="#2563EB">
    <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#timeline"/></animateMotion>
  </circle>

  <!-- 月份刻度与标签 -->
  <g stroke="#9CA3AF" stroke-width="1.5">
    <line x1="140" y1="244" x2="140" y2="256"/>
    <line x1="307" y1="244" x2="307" y2="256"/>
    <line x1="473" y1="244" x2="473" y2="256"/>
    <line x1="807" y1="244" x2="807" y2="256"/>
    <line x1="973" y1="244" x2="973" y2="256"/>
  </g>
  <g font-size="10" fill="#6B7280" text-anchor="middle">
    <text x="140" y="276">7月</text>
    <text x="307" y="276">8月</text>
    <text x="473" y="276">9月</text>
    <text x="807" y="276">10月</text>
    <text x="973" y="276">11月</text>
    <text x="1128" y="276">12月</text>
  </g>

  <!-- 季度分隔虚线 -->
  <line x1="640" y1="130" x2="640" y2="540" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- 里程碑菱形：9月末（Q3 末），带脉冲 -->
  <path d="M640 239 L651 250 L640 261 L629 250 z" fill="#2563EB"/>
  <circle cx="640" cy="250" r="10" fill="none" stroke="#2563EB" stroke-width="1.5">
    <animate attributeName="r" values="10;20" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <!-- 里程碑菱形：12月末（Q4 末），带脉冲 -->
  <path d="M1128 239 L1139 250 L1128 261 L1117 250 z" fill="#2563EB"/>
  <circle cx="1128" cy="250" r="10" fill="none" stroke="#2563EB" stroke-width="1.5">
    <animate attributeName="r" values="10;20" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 季度与主题卡的连接线 -->
  <line x1="390" y1="261" x2="390" y2="336" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="890" y1="261" x2="890" y2="336" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="390" y1="416" x2="390" y2="436" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="890" y1="416" x2="890" y2="436" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Q3 主题卡 1：搜索性能优化 -->
  <g>
    <rect x="240" y="340" width="300" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="390" y="368" text-anchor="middle" font-size="10" fill="#6B7280">Q3 · 主题</text>
    <text x="390" y="396" text-anchor="middle" font-size="15" font-weight="500" fill="#2563EB">搜索性能优化</text>
  </g>

  <!-- Q3 主题卡 2：多语言扩展 -->
  <g>
    <rect x="240" y="440" width="300" height="76" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="390" y="468" text-anchor="middle" font-size="10" fill="#6B7280">Q3 · 主题</text>
    <text x="390" y="496" text-anchor="middle" font-size="15" font-weight="500" fill="#1F2328">多语言扩展</text>
  </g>

  <!-- Q4 主题卡 1：AI 导购助手 -->
  <g>
    <rect x="740" y="340" width="300" height="76" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="890" y="368" text-anchor="middle" font-size="10" fill="#6B7280">Q4 · 主题</text>
    <text x="890" y="396" text-anchor="middle" font-size="15" font-weight="500" fill="#1F2328">AI 导购助手</text>
  </g>

  <!-- Q4 主题卡 2：供应商门户 -->
  <g>
    <rect x="740" y="440" width="300" height="76" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="890" y="468" text-anchor="middle" font-size="10" fill="#6B7280">Q4 · 主题</text>
    <text x="890" y="496" text-anchor="middle" font-size="15" font-weight="500" fill="#1F2328">供应商门户</text>
  </g>

  <!-- 图例 -->
  <g>
    <path d="M72 632 L80 640 L72 648 L64 640 z" fill="#2563EB"/>
    <text x="92" y="644" font-size="11" fill="#6B7280">里程碑（零工期事件）</text>
    <rect x="222" y="631" width="22" height="16" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="254" y="644" font-size="11" fill="#6B7280">主题条目（planned）</text>
  </g>

  <!-- 脚注 -->
  <text x="60" y="690" font-size="10" fill="#6B7280">口径说明：条目粒度为主题，不含任务分解；里程碑时间精确到月（9 月末 / 12 月末）。动画：时间轴流动 + 里程碑脉冲。</text>
</svg>
