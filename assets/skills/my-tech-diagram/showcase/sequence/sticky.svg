<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <!-- 同步消息：实心三角箭头 -->
    <marker id="arrSync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#343A40"/>
    </marker>
    <!-- 异步消息：开口箭头 -->
    <marker id="arrAsync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.5 L10 5 L0 8.5" fill="none" stroke="#343A40" stroke-width="1.5"/>
    </marker>
    <!-- 返回消息：开口箭头（次要灰） -->
    <marker id="arrRet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.5 L10 5 L0 8.5" fill="none" stroke="#868E96" stroke-width="1.5"/>
    </marker>
    <!-- 便签轻投影 -->
    <filter id="noteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1600" height="900" fill="#FAFAFA"/>

  <!-- 标题 -->
  <text x="48" y="52" font-size="22" font-weight="600" fill="#343A40">订单支付时序图</text>
  <text x="48" y="76" font-size="12" fill="#868E96">UML Sequence Diagram · 支付宝异步回调 + 前端轮询确认</text>

  <!-- ============ 参与者（便签头部框 + UML 生命线记号） ============ -->
  <!-- 用户（Actor 小人 + 参与者便签） -->
  <g>
    <circle cx="260" cy="102" r="9" fill="none" stroke="#343A40" stroke-width="1.5"/>
    <line x1="260" y1="111" x2="260" y2="133" stroke="#343A40" stroke-width="1.5"/>
    <line x1="246" y1="120" x2="274" y2="120" stroke="#343A40" stroke-width="1.5"/>
    <line x1="260" y1="133" x2="247" y2="150" stroke="#343A40" stroke-width="1.5"/>
    <line x1="260" y1="133" x2="273" y2="150" stroke="#343A40" stroke-width="1.5"/>
    <g transform="rotate(-0.6 260 182)">
      <rect x="192" y="160" width="136" height="44" rx="3" fill="#FFF9DB" stroke="#B08C00" stroke-width="1.2" filter="url(#noteShadow)"/>
      <path d="M314 160 h14 v14 z" fill="#B08C00" opacity="0.55"/>
      <text x="254" y="176" text-anchor="middle" font-size="10" fill="#868E96">«actor»</text>
      <text x="254" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">用户</text>
    </g>
  </g>

  <!-- 前端 App（命令黄便签） -->
  <g transform="rotate(0.5 620 134)">
    <rect x="530" y="104" width="180" height="60" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2" filter="url(#noteShadow)"/>
    <path d="M696 104 h14 v14 z" fill="#E8B004" opacity="0.55"/>
    <text x="614" y="128" text-anchor="middle" font-size="10" fill="#868E96">«frontend»</text>
    <text x="614" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">前端 App</text>
  </g>

  <!-- 订单 API（事件绿便签） -->
  <g transform="rotate(-0.4 980 134)">
    <rect x="890" y="104" width="180" height="60" rx="3" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2" filter="url(#noteShadow)"/>
    <path d="M1056 104 h14 v14 z" fill="#5C940D" opacity="0.55"/>
    <text x="974" y="128" text-anchor="middle" font-size="10" fill="#868E96">«service»</text>
    <text x="974" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">订单 API</text>
  </g>

  <!-- 支付宝（外部系统便签，粉底虚线边） -->
  <g transform="rotate(0.6 1340 134)">
    <rect x="1250" y="104" width="180" height="60" rx="3" fill="#FCE4EC" stroke="#C2255C" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#noteShadow)"/>
    <path d="M1416 104 h14 v14 z" fill="#C2255C" opacity="0.55"/>
    <text x="1334" y="128" text-anchor="middle" font-size="10" fill="#868E96">«external system»</text>
    <text x="1334" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">支付宝</text>
  </g>

  <!-- ============ 生命线（虚线） ============ -->
  <line x1="260"  y1="206" x2="260"  y2="846" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="620"  y1="164" x2="620"  y2="846" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="980"  y1="164" x2="980"  y2="846" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="1340" y1="164" x2="1340" y2="846" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ============ 激活条 ============ -->
  <rect x="613" y="215" width="14" height="612" rx="3" fill="#FFFFFF" stroke="#343A40" stroke-width="1"/>
  <rect x="973" y="265" width="14" height="312" rx="3" fill="#FFFFFF" stroke="#343A40" stroke-width="1"/>
  <rect x="973" y="648" width="14" height="70"  rx="3" fill="#FFFFFF" stroke="#343A40" stroke-width="1"/>
  <rect x="1333" y="358" width="14" height="54" rx="3" fill="#FFFFFF" stroke="#343A40" stroke-width="1"/>
  <rect x="1333" y="458" width="14" height="20" rx="3" fill="#FFFFFF" stroke="#343A40" stroke-width="1"/>

  <!-- ============ 消息 ============ -->
  <!-- 1 点击支付（同步） -->
  <line x1="260" y1="215" x2="611" y2="215" stroke="#343A40" stroke-width="1.5" marker-end="url(#arrSync)"/>
  <text x="436" y="204" text-anchor="middle" font-size="12" fill="#343A40">点击支付</text>

  <!-- 2 createPayment（同步） -->
  <line x1="627" y1="265" x2="971" y2="265" stroke="#343A40" stroke-width="1.5" marker-end="url(#arrSync)"/>
  <text x="800" y="254" text-anchor="middle" font-size="12" fill="#343A40">createPayment(orderId)</text>

  <!-- 3 返回 paymentNo -->
  <line x1="973" y1="305" x2="629" y2="305" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)"/>
  <text x="800" y="294" text-anchor="middle" font-size="12" fill="#868E96">paymentNo（支付单号）</text>

  <!-- 4 tradePay（同步） -->
  <line x1="987" y1="360" x2="1331" y2="360" stroke="#343A40" stroke-width="1.5" marker-end="url(#arrSync)"/>
  <text x="1160" y="349" text-anchor="middle" font-size="12" fill="#343A40">tradePay(paymentNo)</text>

  <!-- 5 返回 受理成功 -->
  <line x1="1333" y1="400" x2="989" y2="400" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)"/>
  <text x="1160" y="389" text-anchor="middle" font-size="12" fill="#868E96">受理成功（非最终支付结果）</text>

  <!-- 6 异步回调（异步开口箭头，加粗表关键路径） -->
  <line x1="1333" y1="468" x2="989" y2="468" stroke="#343A40" stroke-width="2" marker-end="url(#arrAsync)"/>
  <text x="1160" y="452" text-anchor="middle" font-size="12" font-weight="600" fill="#343A40">notify（异步回调：支付结果）</text>

  <!-- 7 自调用：更新订单状态 -->
  <path d="M987 512 H1060 V542 H989" fill="none" stroke="#343A40" stroke-width="1.5" marker-end="url(#arrSync)"/>
  <text x="1072" y="532" text-anchor="start" font-size="12" fill="#343A40">更新订单状态：待支付 → 已支付</text>

  <!-- ============ loop 组合框：前端轮询 ============ -->
  <rect x="440" y="610" width="700" height="200" fill="none" stroke="#ADB5BD" stroke-width="1.5"/>
  <path d="M440 610 H512 V626 L500 638 H440 Z" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5"/>
  <text x="476" y="629" text-anchor="middle" font-size="11" font-weight="600" fill="#343A40">loop</text>
  <text x="1126" y="632" text-anchor="end" font-size="11" fill="#868E96">[每 2s 轮询一次，直至拿到支付成功或超时退出]</text>

  <!-- 8 queryPaymentResult（同步） -->
  <line x1="627" y1="668" x2="971" y2="668" stroke="#343A40" stroke-width="1.5" marker-end="url(#arrSync)"/>
  <text x="800" y="657" text-anchor="middle" font-size="12" fill="#343A40">queryPaymentResult(paymentNo)</text>

  <!-- 9 返回 支付成功 -->
  <line x1="973" y1="712" x2="629" y2="712" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)"/>
  <text x="800" y="701" text-anchor="middle" font-size="12" fill="#868E96">支付成功</text>

  <!-- 10 返回 展示支付成功 -->
  <line x1="613" y1="820" x2="262" y2="820" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)"/>
  <text x="436" y="809" text-anchor="middle" font-size="12" fill="#868E96">展示支付成功</text>

  <!-- ============ 图例 ============ -->
  <g font-size="10" fill="#868E96">
    <line x1="1170" y1="868" x2="1206" y2="868" stroke="#343A40" stroke-width="1.5" marker-end="url(#arrSync)"/>
    <text x="1214" y="872">同步调用</text>
    <line x1="1278" y1="868" x2="1314" y2="868" stroke="#343A40" stroke-width="1.5" marker-end="url(#arrAsync)"/>
    <text x="1322" y="872">异步消息</text>
    <line x1="1386" y1="868" x2="1422" y2="868" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)"/>
    <text x="1430" y="872">返回</text>
  </g>
</svg>
