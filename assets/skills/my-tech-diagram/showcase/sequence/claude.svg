<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <!-- 同步消息：实心三角箭头（暖黑） -->
    <marker id="arrSync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2B2118"/>
    </marker>
    <!-- 异步消息：开口箭头（赭橙主色） -->
    <marker id="arrAsync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.5 L10 5 L0 8.5" fill="none" stroke="#D97757" stroke-width="1.5"/>
    </marker>
    <!-- 返回消息：开口箭头（暖灰次要色） -->
    <marker id="arrRet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.5 L10 5 L0 8.5" fill="none" stroke="#8A7B6B" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 背景：暖米白 -->
  <rect width="1600" height="900" fill="#F5F1EA"/>

  <!-- 标题（衬线） -->
  <text x="48" y="52" font-size="22" font-weight="600" fill="#2B2118" font-family="Georgia, 'Times New Roman', 'Songti SC', 'SimSun', serif">订单支付时序图</text>
  <text x="48" y="76" font-size="12" fill="#8A7B6B">UML Sequence Diagram · 支付宝异步回调 + 前端轮询确认</text>

  <!-- ============ 参与者 ============ -->
  <!-- 用户（Actor 小人） -->
  <g>
    <circle cx="260" cy="108" r="10" fill="none" stroke="#2B2118" stroke-width="1.5"/>
    <line x1="260" y1="118" x2="260" y2="142" stroke="#2B2118" stroke-width="1.5"/>
    <line x1="244" y1="128" x2="276" y2="128" stroke="#2B2118" stroke-width="1.5"/>
    <line x1="260" y1="142" x2="246" y2="162" stroke="#2B2118" stroke-width="1.5"/>
    <line x1="260" y1="142" x2="274" y2="162" stroke="#2B2118" stroke-width="1.5"/>
    <text x="260" y="182" text-anchor="middle" font-size="10" fill="#8A7B6B">«actor»</text>
    <text x="260" y="198" text-anchor="middle" font-size="14" font-weight="500" fill="#2B2118">用户</text>
  </g>

  <!-- 前端 App（顶部主色条） -->
  <g>
    <rect x="530" y="104" width="180" height="60" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
    <rect x="530" y="104" width="180" height="4" rx="2" fill="#D97757"/>
    <text x="620" y="130" text-anchor="middle" font-size="10" fill="#8A7B6B">«frontend»</text>
    <text x="620" y="150" text-anchor="middle" font-size="14" font-weight="500" fill="#2B2118">前端 App</text>
  </g>

  <!-- 订单 API -->
  <g>
    <rect x="890" y="104" width="180" height="60" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
    <rect x="890" y="104" width="180" height="4" rx="2" fill="#D97757"/>
    <text x="980" y="130" text-anchor="middle" font-size="10" fill="#8A7B6B">«service»</text>
    <text x="980" y="150" text-anchor="middle" font-size="14" font-weight="500" fill="#2B2118">订单 API</text>
  </g>

  <!-- 支付宝（外部系统，主色描边） -->
  <g>
    <rect x="1250" y="104" width="180" height="60" rx="10" fill="#FDFBF7" stroke="#D97757" stroke-width="1.5"/>
    <rect x="1250" y="104" width="180" height="4" rx="2" fill="#D97757"/>
    <text x="1340" y="130" text-anchor="middle" font-size="10" fill="#8A7B6B">«external system»</text>
    <text x="1340" y="150" text-anchor="middle" font-size="14" font-weight="500" fill="#C2542F">支付宝</text>
  </g>

  <!-- ============ 生命线（虚线，暖灰） ============ -->
  <line x1="260"  y1="206" x2="260"  y2="846" stroke="#C9BFAE" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="620"  y1="164" x2="620"  y2="846" stroke="#C9BFAE" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="980"  y1="164" x2="980"  y2="846" stroke="#C9BFAE" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="1340" y1="164" x2="1340" y2="846" stroke="#C9BFAE" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ============ 激活条 ============ -->
  <rect x="613" y="215" width="14" height="612" rx="3" fill="#FDFBF7" stroke="#D97757" stroke-width="1"/>
  <rect x="973" y="265" width="14" height="312" rx="3" fill="#FDFBF7" stroke="#D97757" stroke-width="1"/>
  <rect x="973" y="648" width="14" height="70"  rx="3" fill="#FDFBF7" stroke="#D97757" stroke-width="1"/>
  <rect x="1333" y="358" width="14" height="54" rx="3" fill="#FDFBF7" stroke="#D97757" stroke-width="1"/>
  <rect x="1333" y="458" width="14" height="20" rx="3" fill="#FDFBF7" stroke="#D97757" stroke-width="1"/>

  <!-- ============ 消息 ============ -->
  <!-- 1 点击支付（同步） -->
  <line x1="260" y1="215" x2="611" y2="215" stroke="#2B2118" stroke-width="1.5" marker-end="url(#arrSync)"/>
  <text x="436" y="204" text-anchor="middle" font-size="12" fill="#2B2118">点击支付</text>

  <!-- 2 createPayment（同步） -->
  <line x1="627" y1="265" x2="971" y2="265" stroke="#2B2118" stroke-width="1.5" marker-end="url(#arrSync)"/>
  <text x="800" y="254" text-anchor="middle" font-size="12" fill="#2B2118">createPayment(orderId)</text>

  <!-- 3 返回 paymentNo -->
  <line x1="973" y1="305" x2="629" y2="305" stroke="#8A7B6B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)"/>
  <text x="800" y="294" text-anchor="middle" font-size="12" fill="#8A7B6B">paymentNo（支付单号）</text>

  <!-- 4 tradePay（同步） -->
  <line x1="987" y1="360" x2="1331" y2="360" stroke="#2B2118" stroke-width="1.5" marker-end="url(#arrSync)"/>
  <text x="1160" y="349" text-anchor="middle" font-size="12" fill="#2B2118">tradePay(paymentNo)</text>

  <!-- 5 返回 受理成功 -->
  <line x1="1333" y1="400" x2="989" y2="400" stroke="#8A7B6B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)"/>
  <text x="1160" y="389" text-anchor="middle" font-size="12" fill="#8A7B6B">受理成功（非最终支付结果）</text>

  <!-- 6 异步回调（异步，赭橙主色，关键路径） -->
  <line x1="1333" y1="468" x2="989" y2="468" stroke="#D97757" stroke-width="2" marker-end="url(#arrAsync)"/>
  <text x="1160" y="452" text-anchor="middle" font-size="12" font-weight="600" fill="#C2542F">notify（异步回调：支付结果）</text>

  <!-- 7 自调用：更新订单状态 -->
  <path d="M987 512 H1060 V542 H989" fill="none" stroke="#2B2118" stroke-width="1.5" marker-end="url(#arrSync)"/>
  <text x="1072" y="532" text-anchor="start" font-size="12" fill="#2B2118">更新订单状态：待支付 → 已支付</text>

  <!-- ============ loop 组合框：前端轮询 ============ -->
  <rect x="440" y="610" width="700" height="200" fill="none" stroke="#C9BFAE" stroke-width="1.5"/>
  <path d="M440 610 H512 V626 L500 638 H440 Z" fill="#FDFBF7" stroke="#C9BFAE" stroke-width="1.5"/>
  <text x="476" y="629" text-anchor="middle" font-size="11" font-weight="600" fill="#C2542F">loop</text>
  <text x="1126" y="632" text-anchor="end" font-size="11" fill="#8A7B6B">[每 2s 轮询一次，直至拿到支付成功或超时退出]</text>

  <!-- 8 queryPaymentResult（同步） -->
  <line x1="627" y1="668" x2="971" y2="668" stroke="#2B2118" stroke-width="1.5" marker-end="url(#arrSync)"/>
  <text x="800" y="657" text-anchor="middle" font-size="12" fill="#2B2118">queryPaymentResult(paymentNo)</text>

  <!-- 9 返回 支付成功 -->
  <line x1="973" y1="712" x2="629" y2="712" stroke="#8A7B6B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)"/>
  <text x="800" y="701" text-anchor="middle" font-size="12" fill="#8A7B6B">支付成功</text>

  <!-- 10 返回 展示支付成功 -->
  <line x1="613" y1="820" x2="262" y2="820" stroke="#8A7B6B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)"/>
  <text x="436" y="809" text-anchor="middle" font-size="12" fill="#8A7B6B">展示支付成功</text>

  <!-- ============ 图例 ============ -->
  <g font-size="10" fill="#8A7B6B">
    <line x1="1170" y1="868" x2="1206" y2="868" stroke="#2B2118" stroke-width="1.5" marker-end="url(#arrSync)"/>
    <text x="1214" y="872">同步调用</text>
    <line x1="1278" y1="868" x2="1314" y2="868" stroke="#D97757" stroke-width="1.5" marker-end="url(#arrAsync)"/>
    <text x="1322" y="872">异步消息</text>
    <line x1="1386" y1="868" x2="1422" y2="868" stroke="#8A7B6B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)"/>
    <text x="1430" y="872">返回</text>
  </g>
</svg>
