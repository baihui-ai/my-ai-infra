<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <!-- 网格背景 -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#1C2330" stroke-width="0.5"/>
    </pattern>
    <!-- 发光（仅关键路径与强调节点） -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 同步消息：实心三角箭头（青） -->
    <marker id="arrSync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22D3EE"/>
    </marker>
    <!-- 异步消息：开口箭头（紫） -->
    <marker id="arrAsync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.5 L10 5 L0 8.5" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
    </marker>
    <!-- 返回消息：开口箭头（次要灰） -->
    <marker id="arrRet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.5 L10 5 L0 8.5" fill="none" stroke="#8B949E" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1600" height="900" fill="#0D1117"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="48" y="52" font-size="22" font-weight="600" fill="#E6EDF3">订单支付时序图</text>
  <text x="48" y="76" font-size="12" fill="#8B949E">UML Sequence Diagram · 支付宝异步回调 + 前端轮询确认 · SMIL 动画：消息按时间序逐条绘制（12s 循环）</text>

  <!-- ============ 参与者 ============ -->
  <!-- 用户（Actor 小人） -->
  <g>
    <circle cx="260" cy="108" r="10" fill="none" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
    <line x1="260" y1="118" x2="260" y2="142" stroke="#22D3EE" stroke-width="2"/>
    <line x1="244" y1="128" x2="276" y2="128" stroke="#22D3EE" stroke-width="2"/>
    <line x1="260" y1="142" x2="246" y2="162" stroke="#22D3EE" stroke-width="2"/>
    <line x1="260" y1="142" x2="274" y2="162" stroke="#22D3EE" stroke-width="2"/>
    <text x="260" y="182" text-anchor="middle" font-size="10" fill="#8B949E">«actor»</text>
    <text x="260" y="198" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">用户</text>
  </g>

  <!-- 前端 App -->
  <g>
    <rect x="530" y="104" width="180" height="60" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="620" y="128" text-anchor="middle" font-size="10" fill="#8B949E">«frontend»</text>
    <text x="620" y="148" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">前端 App</text>
  </g>

  <!-- 订单 API -->
  <g>
    <rect x="890" y="104" width="180" height="60" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="980" y="128" text-anchor="middle" font-size="10" fill="#8B949E">«service»</text>
    <text x="980" y="148" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF3">订单 API</text>
  </g>

  <!-- 支付宝（外部系统，紫强调） -->
  <g>
    <rect x="1250" y="104" width="180" height="60" rx="10" fill="#161B22" stroke="#A78BFA" stroke-width="2" filter="url(#glow)"/>
    <text x="1340" y="128" text-anchor="middle" font-size="10" fill="#8B949E">«external system»</text>
    <text x="1340" y="148" text-anchor="middle" font-size="14" font-weight="500" fill="#A78BFA">支付宝</text>
  </g>

  <!-- ============ 生命线 ============ -->
  <line x1="260"  y1="206" x2="260"  y2="846" stroke="#3D4450" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="620"  y1="164" x2="620"  y2="846" stroke="#3D4450" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="980"  y1="164" x2="980"  y2="846" stroke="#3D4450" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="1340" y1="164" x2="1340" y2="846" stroke="#3D4450" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ============ 激活条 ============ -->
  <rect x="613" y="215" width="14" height="612" rx="3" fill="#161B22" stroke="#22D3EE" stroke-width="1"/>
  <rect x="973" y="265" width="14" height="312" rx="3" fill="#161B22" stroke="#22D3EE" stroke-width="1"/>
  <rect x="973" y="648" width="14" height="70"  rx="3" fill="#161B22" stroke="#22D3EE" stroke-width="1"/>
  <rect x="1333" y="358" width="14" height="54" rx="3" fill="#161B22" stroke="#A78BFA" stroke-width="1"/>
  <rect x="1333" y="458" width="14" height="20" rx="3" fill="#161B22" stroke="#A78BFA" stroke-width="1"/>

  <!-- ============ 消息（逐条绘制：实线消息用 stroke-dashoffset 生长，虚线返回用淡入） ============ -->
  <!-- 1 点击支付（同步） -->
  <line x1="260" y1="215" x2="611" y2="215" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="351" marker-end="url(#arrSync)">
    <animate attributeName="stroke-dashoffset" values="351;351;0;0" keyTimes="0;0.0417;0.1167;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0417;0.1167;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="436" y="204" text-anchor="middle" font-size="12" fill="#E6EDF3">点击支付
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0792;0.1167;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 2 createPayment（同步） -->
  <line x1="627" y1="265" x2="971" y2="265" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="344" marker-end="url(#arrSync)">
    <animate attributeName="stroke-dashoffset" values="344;344;0;0" keyTimes="0;0.1333;0.2083;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1333;0.2083;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="800" y="254" text-anchor="middle" font-size="12" fill="#E6EDF3">createPayment(orderId)
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1708;0.2083;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 3 返回 paymentNo（虚线，淡入） -->
  <line x1="973" y1="305" x2="629" y2="305" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.225;0.3;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="800" y="294" text-anchor="middle" font-size="12" fill="#8B949E">paymentNo（支付单号）
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2625;0.3;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 4 tradePay（同步） -->
  <line x1="987" y1="360" x2="1331" y2="360" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="344" marker-end="url(#arrSync)">
    <animate attributeName="stroke-dashoffset" values="344;344;0;0" keyTimes="0;0.3167;0.3917;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3167;0.3917;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="1160" y="349" text-anchor="middle" font-size="12" fill="#E6EDF3">tradePay(paymentNo)
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3542;0.3917;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 5 返回 受理成功（虚线，淡入） -->
  <line x1="1333" y1="400" x2="989" y2="400" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4083;0.4833;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="1160" y="389" text-anchor="middle" font-size="12" fill="#8B949E">受理成功（非最终支付结果）
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4458;0.4833;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 6 异步回调（异步，紫 + 发光，关键路径；辉光底层与绘制线分离，规避 dasharray+filter 渲染冲突） -->
  <line x1="1333" y1="468" x2="989" y2="468" stroke="#A78BFA" stroke-width="6" opacity="0.3" filter="url(#glow)">
    <animate attributeName="opacity" values="0;0;0.3;0.3" keyTimes="0;0.5;0.575;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <line x1="1333" y1="468" x2="989" y2="468" stroke="#A78BFA" stroke-width="2" stroke-dasharray="344" marker-end="url(#arrAsync)">
    <animate attributeName="stroke-dashoffset" values="344;344;0;0" keyTimes="0;0.5;0.575;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.575;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="1160" y="452" text-anchor="middle" font-size="12" font-weight="600" fill="#A78BFA">notify（异步回调：支付结果）
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5375;0.575;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <!-- 异步回调数据包：沿 notify 路径飞行（仅在回调时段可见） -->
  <path id="p6" d="M1333 468 H989" fill="none" stroke="none"/>
  <circle r="4" fill="#A78BFA" opacity="0">
    <animateMotion dur="1.5s" begin="6.9s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.575;0.59;0.79;0.825;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- 7 自调用：更新订单状态 -->
  <path d="M987 512 H1060 V542 H989" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="174" marker-end="url(#arrSync)">
    <animate attributeName="stroke-dashoffset" values="174;174;0;0" keyTimes="0;0.5917;0.6667;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5917;0.6667;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="1072" y="532" text-anchor="start" font-size="12" fill="#E6EDF3">更新订单状态：待支付 → 已支付
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6292;0.6667;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- ============ loop 组合框：前端轮询（随轮询段出现） ============ -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6333;0.6917;1" dur="12s" repeatCount="indefinite"/>
    <rect x="440" y="610" width="700" height="200" fill="none" stroke="#3D4450" stroke-width="1.5"/>
    <path d="M440 610 H512 V626 L500 638 H440 Z" fill="#161B22" stroke="#3D4450" stroke-width="1.5"/>
    <text x="476" y="629" text-anchor="middle" font-size="11" font-weight="600" fill="#22D3EE">loop</text>
    <text x="1126" y="632" text-anchor="end" font-size="11" fill="#8B949E">[每 2s 轮询一次，直至拿到支付成功或超时退出]</text>
  </g>

  <!-- 8 queryPaymentResult（同步） -->
  <line x1="627" y1="668" x2="971" y2="668" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="344" marker-end="url(#arrSync)">
    <animate attributeName="stroke-dashoffset" values="344;344;0;0" keyTimes="0;0.7167;0.7917;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7167;0.7917;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="800" y="657" text-anchor="middle" font-size="12" fill="#E6EDF3">queryPaymentResult(paymentNo)
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7542;0.7917;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 9 返回 支付成功（虚线，淡入） -->
  <line x1="973" y1="712" x2="629" y2="712" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8083;0.8833;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="800" y="701" text-anchor="middle" font-size="12" fill="#8B949E">支付成功
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8458;0.8833;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- 10 返回 展示支付成功（虚线，淡入） -->
  <line x1="613" y1="820" x2="262" y2="820" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9;0.975;1" dur="12s" repeatCount="indefinite"/>
  </line>
  <text x="436" y="809" text-anchor="middle" font-size="12" fill="#8B949E">展示支付成功
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9375;0.975;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- ============ 图例 ============ -->
  <g font-size="10" fill="#8B949E">
    <line x1="1170" y1="868" x2="1206" y2="868" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#arrSync)"/>
    <text x="1214" y="872">同步调用</text>
    <line x1="1278" y1="868" x2="1314" y2="868" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrAsync)"/>
    <text x="1322" y="872">异步消息</text>
    <line x1="1386" y1="868" x2="1422" y2="868" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRet)"/>
    <text x="1430" y="872">返回</text>
  </g>
</svg>
