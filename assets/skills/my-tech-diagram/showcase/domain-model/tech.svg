<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#1C2330" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#0D1117"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="64" y="48" font-size="20" font-weight="600" fill="#E6EDF3">合同管理限界上下文 · 领域模型图</text>

  <!-- 聚合边界（虚线圆角框） -->
  <rect x="64" y="170" width="240" height="140" rx="12" fill="none" stroke="#6E7681" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="88" y="192" font-size="11" fill="#8B949E">项目聚合</text>

  <rect x="380" y="150" width="520" height="380" rx="12" fill="none" stroke="#6E7681" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="404" y="172" font-size="11" fill="#8B949E">合同聚合</text>

  <rect x="976" y="170" width="240" height="140" rx="12" fill="none" stroke="#6E7681" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1000" y="192" font-size="11" fill="#8B949E">供应商聚合</text>

  <!-- 连线（置于卡片下层） -->
  <!-- R1 Project 1 — 1..* Contract（跨聚合 ID 引用，虚线，霓虹青） -->
  <line x1="272" y1="246" x2="520" y2="246" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- R3 Contract 0..* — 1 Supplier（跨聚合 ID 引用，虚线，霓虹青） -->
  <line x1="760" y1="246" x2="1008" y2="246" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- R2/R4 Contract 1 — 0..* ContractAttachment（聚合内，实线） -->
  <path d="M 560 268 V 350 H 522 V 430" fill="none" stroke="#3D4450" stroke-width="1.5"/>
  <!-- R5 Contract 1 — 1 Money（聚合内，实线） -->
  <path d="M 720 268 V 350 H 758 V 430" fill="none" stroke="#3D4450" stroke-width="1.5"/>

  <!-- 多重性与引用方式标注 -->
  <text x="288" y="236" text-anchor="middle" font-size="11" fill="#8B949E">1</text>
  <text x="500" y="236" text-anchor="middle" font-size="11" fill="#8B949E">1..*</text>
  <text x="342" y="232" text-anchor="middle" font-size="10" fill="#22D3EE">ID 引用</text>

  <text x="780" y="236" text-anchor="middle" font-size="11" fill="#8B949E">0..*</text>
  <text x="992" y="236" text-anchor="middle" font-size="11" fill="#8B949E">1</text>
  <text x="938" y="232" text-anchor="middle" font-size="10" fill="#22D3EE">ID 引用</text>

  <text x="570" y="296" text-anchor="start" font-size="11" fill="#8B949E">1</text>
  <text x="530" y="414" text-anchor="start" font-size="11" fill="#8B949E">0..*</text>

  <text x="730" y="296" text-anchor="start" font-size="11" fill="#8B949E">1</text>
  <text x="766" y="414" text-anchor="start" font-size="11" fill="#8B949E">1</text>

  <!-- Project 卡片（聚合根，青色描边 + glow） -->
  <rect x="96" y="210" width="176" height="72" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
  <text x="184" y="225" text-anchor="middle" font-size="10" fill="#8B949E">聚合根 · Aggregate Root</text>
  <text x="184" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#22D3EE">Project</text>
  <line x1="108" y1="253" x2="260" y2="253" stroke="#30363D" stroke-width="1"/>
  <text x="184" y="271" text-anchor="middle" font-size="13" fill="#E6EDF3">项目</text>

  <!-- Contract 卡片（聚合根，青色描边 + glow） -->
  <rect x="520" y="196" width="240" height="72" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
  <text x="640" y="211" text-anchor="middle" font-size="10" fill="#8B949E">聚合根 · Aggregate Root</text>
  <text x="640" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#22D3EE">Contract</text>
  <line x1="532" y1="239" x2="748" y2="239" stroke="#30363D" stroke-width="1"/>
  <text x="640" y="257" text-anchor="middle" font-size="13" fill="#E6EDF3">合同</text>

  <!-- ContractAttachment 卡片（实体） -->
  <rect x="412" y="430" width="220" height="72" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="522" y="445" text-anchor="middle" font-size="10" fill="#8B949E">实体 · Entity</text>
  <text x="522" y="464" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">ContractAttachment</text>
  <line x1="424" y1="473" x2="620" y2="473" stroke="#30363D" stroke-width="1"/>
  <text x="522" y="491" text-anchor="middle" font-size="13" fill="#E6EDF3">合同附件</text>

  <!-- Money 卡片（值对象，紫色描边） -->
  <rect x="668" y="430" width="180" height="72" rx="10" fill="#161B22" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="758" y="445" text-anchor="middle" font-size="10" fill="#8B949E">值对象 · Value Object</text>
  <text x="758" y="464" text-anchor="middle" font-size="14" font-weight="600" fill="#A78BFA">Money</text>
  <line x1="680" y1="473" x2="836" y2="473" stroke="#30363D" stroke-width="1"/>
  <text x="758" y="491" text-anchor="middle" font-size="13" fill="#E6EDF3">金额</text>

  <!-- Supplier 卡片（聚合根，青色描边 + glow） -->
  <rect x="1008" y="210" width="176" height="72" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
  <text x="1096" y="225" text-anchor="middle" font-size="10" fill="#8B949E">聚合根 · Aggregate Root</text>
  <text x="1096" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#22D3EE">Supplier</text>
  <line x1="1020" y1="253" x2="1172" y2="253" stroke="#30363D" stroke-width="1"/>
  <text x="1096" y="271" text-anchor="middle" font-size="13" fill="#E6EDF3">供应商</text>

  <!-- 图例 -->
  <rect x="64" y="638" width="24" height="16" rx="4" fill="none" stroke="#6E7681" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="96" y="650" font-size="10" fill="#8B949E">聚合边界</text>

  <rect x="170" y="638" width="24" height="16" rx="4" fill="#161B22" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="202" y="650" font-size="10" fill="#8B949E">聚合根</text>

  <rect x="260" y="638" width="24" height="16" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <text x="292" y="650" font-size="10" fill="#8B949E">实体</text>

  <rect x="340" y="638" width="24" height="16" rx="4" fill="#161B22" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="372" y="650" font-size="10" fill="#8B949E">值对象</text>

  <line x1="440" y1="646" x2="464" y2="646" stroke="#3D4450" stroke-width="1.5"/>
  <text x="472" y="650" font-size="10" fill="#8B949E">聚合内关联</text>

  <line x1="556" y1="646" x2="580" y2="646" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="588" y="650" font-size="10" fill="#8B949E">跨聚合 ID 引用</text>

  <!-- 脚注：假设声明 -->
  <text x="64" y="676" font-size="10" fill="#8B949E">注：「项目 → 合同」的跨聚合引用方式用户未指定，按 ID 引用绘制（假设）；「合同 — 金额 Money」多重性按 1 对 1 绘制（假设）。</text>
</svg>
