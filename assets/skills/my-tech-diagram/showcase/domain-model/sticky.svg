<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="stick" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#FAFAFA"/>

  <!-- 标题 -->
  <text x="64" y="48" font-size="20" font-weight="600" fill="#343A40">合同管理限界上下文 · 领域模型图</text>

  <!-- 聚合边界（虚线圆角框 + 粉色分组标题条） -->
  <rect x="64" y="170" width="240" height="140" rx="8" fill="none" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="76" y="160" width="96" height="24" rx="4" fill="#FCE4EC" stroke="#AD1457" stroke-width="1"/>
  <text x="124" y="176" text-anchor="middle" font-size="11" font-weight="600" fill="#880E4F">项目聚合</text>

  <rect x="380" y="150" width="520" height="380" rx="8" fill="none" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="392" y="140" width="96" height="24" rx="4" fill="#FCE4EC" stroke="#AD1457" stroke-width="1"/>
  <text x="440" y="156" text-anchor="middle" font-size="11" font-weight="600" fill="#880E4F">合同聚合</text>

  <rect x="976" y="170" width="240" height="140" rx="8" fill="none" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="988" y="160" width="108" height="24" rx="4" fill="#FCE4EC" stroke="#AD1457" stroke-width="1"/>
  <text x="1042" y="176" text-anchor="middle" font-size="11" font-weight="600" fill="#880E4F">供应商聚合</text>

  <!-- 连线（置于卡片下层） -->
  <!-- R1 Project 1 — 1..* Contract（跨聚合 ID 引用，虚线） -->
  <line x1="272" y1="246" x2="520" y2="246" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- R3 Contract 0..* — 1 Supplier（跨聚合 ID 引用，虚线） -->
  <line x1="760" y1="246" x2="1008" y2="246" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- R2/R4 Contract 1 — 0..* ContractAttachment（聚合内，实线） -->
  <path d="M 560 268 V 350 H 522 V 430" fill="none" stroke="#868E96" stroke-width="1.5"/>
  <!-- R5 Contract 1 — 1 Money（聚合内，实线） -->
  <path d="M 720 268 V 350 H 758 V 430" fill="none" stroke="#868E96" stroke-width="1.5"/>

  <!-- 多重性与引用方式标注 -->
  <text x="288" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#343A40">1</text>
  <text x="500" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#343A40">1..*</text>
  <text x="342" y="232" text-anchor="middle" font-size="10" fill="#868E96">ID 引用</text>

  <text x="780" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#343A40">0..*</text>
  <text x="992" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#343A40">1</text>
  <text x="938" y="232" text-anchor="middle" font-size="10" fill="#868E96">ID 引用</text>

  <text x="570" y="296" text-anchor="start" font-size="11" font-weight="600" fill="#343A40">1</text>
  <text x="530" y="414" text-anchor="start" font-size="11" font-weight="600" fill="#343A40">0..*</text>

  <text x="730" y="296" text-anchor="start" font-size="11" font-weight="600" fill="#343A40">1</text>
  <text x="766" y="414" text-anchor="start" font-size="11" font-weight="600" fill="#343A40">1</text>

  <!-- Project 便签（聚合根，黄） -->
  <g filter="url(#stick)">
    <rect x="96" y="210" width="176" height="72" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2"/>
    <path d="M258 210 h14 v14 z" fill="#E8B004" opacity="0.55"/>
    <text x="184" y="225" text-anchor="middle" font-size="10" fill="#868E96">聚合根 · Aggregate Root</text>
    <text x="184" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">Project</text>
    <line x1="108" y1="253" x2="260" y2="253" stroke="#E8B004" stroke-width="1" opacity="0.6"/>
    <text x="184" y="271" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">项目</text>
  </g>

  <!-- Contract 便签（聚合根，黄） -->
  <g filter="url(#stick)">
    <rect x="520" y="196" width="240" height="72" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2"/>
    <path d="M746 196 h14 v14 z" fill="#E8B004" opacity="0.55"/>
    <text x="640" y="211" text-anchor="middle" font-size="10" fill="#868E96">聚合根 · Aggregate Root</text>
    <text x="640" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">Contract</text>
    <line x1="532" y1="239" x2="748" y2="239" stroke="#E8B004" stroke-width="1" opacity="0.6"/>
    <text x="640" y="257" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">合同</text>
  </g>

  <!-- ContractAttachment 便签（实体，绿） -->
  <g filter="url(#stick)">
    <rect x="412" y="430" width="220" height="72" rx="3" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2"/>
    <path d="M618 430 h14 v14 z" fill="#5C940D" opacity="0.55"/>
    <text x="522" y="445" text-anchor="middle" font-size="10" fill="#868E96">实体 · Entity</text>
    <text x="522" y="464" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">ContractAttachment</text>
    <line x1="424" y1="473" x2="620" y2="473" stroke="#5C940D" stroke-width="1" opacity="0.5"/>
    <text x="522" y="491" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">合同附件</text>
  </g>

  <!-- Money 便签（值对象，浅黄） -->
  <g filter="url(#stick)">
    <rect x="668" y="430" width="180" height="72" rx="3" fill="#FFF9DB" stroke="#B08C00" stroke-width="1.2"/>
    <path d="M834 430 h14 v14 z" fill="#B08C00" opacity="0.55"/>
    <text x="758" y="445" text-anchor="middle" font-size="10" fill="#868E96">值对象 · Value Object</text>
    <text x="758" y="464" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">Money</text>
    <line x1="680" y1="473" x2="836" y2="473" stroke="#B08C00" stroke-width="1" opacity="0.5"/>
    <text x="758" y="491" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">金额</text>
  </g>

  <!-- Supplier 便签（聚合根，黄） -->
  <g filter="url(#stick)">
    <rect x="1008" y="210" width="176" height="72" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2"/>
    <path d="M1170 210 h14 v14 z" fill="#E8B004" opacity="0.55"/>
    <text x="1096" y="225" text-anchor="middle" font-size="10" fill="#868E96">聚合根 · Aggregate Root</text>
    <text x="1096" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#343A40">Supplier</text>
    <line x1="1020" y1="253" x2="1172" y2="253" stroke="#E8B004" stroke-width="1" opacity="0.6"/>
    <text x="1096" y="271" text-anchor="middle" font-size="13" font-weight="600" fill="#343A40">供应商</text>
  </g>

  <!-- 图例 -->
  <rect x="64" y="638" width="24" height="16" rx="4" fill="none" stroke="#868E96" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="96" y="650" font-size="10" fill="#868E96">聚合边界</text>

  <rect x="170" y="638" width="24" height="16" rx="3" fill="#FFF3BF" stroke="#E8B004" stroke-width="1.2"/>
  <text x="202" y="650" font-size="10" fill="#868E96">聚合根</text>

  <rect x="260" y="638" width="24" height="16" rx="3" fill="#D3F9D8" stroke="#5C940D" stroke-width="1.2"/>
  <text x="292" y="650" font-size="10" fill="#868E96">实体</text>

  <rect x="340" y="638" width="24" height="16" rx="3" fill="#FFF9DB" stroke="#B08C00" stroke-width="1.2"/>
  <text x="372" y="650" font-size="10" fill="#868E96">值对象</text>

  <line x1="440" y1="646" x2="464" y2="646" stroke="#868E96" stroke-width="1.5"/>
  <text x="472" y="650" font-size="10" fill="#868E96">聚合内关联</text>

  <line x1="556" y1="646" x2="580" y2="646" stroke="#868E96" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="588" y="650" font-size="10" fill="#868E96">跨聚合 ID 引用</text>

  <!-- 脚注：假设声明 -->
  <text x="64" y="676" font-size="10" fill="#868E96">注：「项目 → 合同」的跨聚合引用方式用户未指定，按 ID 引用绘制（假设）；「合同 — 金额 Money」多重性按 1 对 1 绘制（假设）。</text>
</svg>
