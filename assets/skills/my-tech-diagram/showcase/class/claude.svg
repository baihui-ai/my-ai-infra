<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="gen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#F5F1EA" stroke="#C9BFAE" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="675" fill="#F5F1EA"/>

  <!-- 标题 -->
  <text x="60" y="58" font-size="22" font-weight="600" fill="#2B2118" font-family="Georgia,'Times New Roman','Songti SC','SimSun',serif">Order 类图</text>
  <text x="60" y="80" font-size="11" fill="#8A7B6B">UML Class Diagram</text>

  <!-- ========== Order ========== -->
  <g>
    <rect x="80" y="120" width="220" height="150" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
    <rect x="80" y="120" width="220" height="4" rx="2" fill="#D97757"/>
    <text x="190" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2118">Order</text>
    <line x1="80" y1="156" x2="300" y2="156" stroke="#E3DCD0" stroke-width="1.5"/>
    <text x="96" y="178" font-size="12" fill="#2B2118">+ id</text>
    <text x="96" y="200" font-size="12" fill="#2B2118">+ status</text>
    <text x="96" y="222" font-size="12" fill="#2B2118">+ totalAmount</text>
    <line x1="80" y1="232" x2="300" y2="232" stroke="#E3DCD0" stroke-width="1.5"/>
    <text x="96" y="252" font-size="12" fill="#2B2118">+ pay()</text>
    <text x="96" y="270" font-size="12" fill="#2B2118" dy="-0.2em">+ cancel()</text>
  </g>

  <!-- ========== OrderLine ========== -->
  <g>
    <rect x="520" y="140" width="220" height="88" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
    <rect x="520" y="140" width="220" height="4" rx="2" fill="#D97757"/>
    <text x="630" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2118">OrderLine</text>
    <line x1="520" y1="176" x2="740" y2="176" stroke="#E3DCD0" stroke-width="1.5"/>
    <text x="536" y="198" font-size="12" fill="#2B2118">+ quantity</text>
    <text x="536" y="220" font-size="12" fill="#2B2118">+ unitPrice</text>
  </g>

  <!-- ========== Product ========== -->
  <g>
    <rect x="880" y="140" width="220" height="88" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
    <rect x="880" y="140" width="220" height="4" rx="2" fill="#D97757"/>
    <text x="990" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2118">Product</text>
    <line x1="880" y1="176" x2="1100" y2="176" stroke="#E3DCD0" stroke-width="1.5"/>
    <text x="896" y="198" font-size="12" fill="#2B2118">+ name</text>
    <text x="896" y="220" font-size="12" fill="#2B2118">+ price</text>
  </g>

  <!-- ========== Customer ========== -->
  <g>
    <rect x="80" y="420" width="220" height="56" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
    <rect x="80" y="420" width="220" height="4" rx="2" fill="#D97757"/>
    <text x="190" y="453" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2118">Customer</text>
  </g>

  <!-- ========== VIPCustomer ========== -->
  <g>
    <rect x="80" y="556" width="220" height="56" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
    <rect x="80" y="556" width="220" height="4" rx="2" fill="#D97757"/>
    <text x="190" y="589" text-anchor="middle" font-size="14" font-weight="600" fill="#2B2118">VIPCustomer</text>
  </g>

  <!-- ========== 关系 ========== -->
  <!-- 组合：Order ◆—— OrderLine（菱形在整体 Order 端） -->
  <line x1="318" y1="184" x2="518" y2="184" stroke="#C9BFAE" stroke-width="1.5"/>
  <polygon points="300,184 310,177 320,184 310,191" fill="#D97757"/>
  <text x="330" y="172" font-size="11" fill="#8A7B6B">1</text>
  <text x="512" y="172" text-anchor="end" font-size="11" fill="#8A7B6B">1..*</text>

  <!-- 关联：OrderLine —— Product（Product 端多重性 1） -->
  <line x1="742" y1="184" x2="878" y2="184" stroke="#C9BFAE" stroke-width="1.5"/>
  <text x="872" y="172" text-anchor="end" font-size="11" fill="#8A7B6B">1</text>

  <!-- 关联：Order —— Customer（Customer 端多重性 1） -->
  <line x1="190" y1="272" x2="190" y2="418" stroke="#C9BFAE" stroke-width="1.5"/>
  <text x="202" y="412" font-size="11" fill="#8A7B6B">1</text>

  <!-- 继承：VIPCustomer —▷ Customer（空心三角指向父类） -->
  <line x1="190" y1="554" x2="190" y2="478" stroke="#C9BFAE" stroke-width="1.5" marker-end="url(#gen)"/>

  <!-- ========== 图例 ========== -->
  <g>
    <rect x="760" y="560" width="380" height="76" rx="10" fill="#FDFBF7" stroke="#E3DCD0" stroke-width="1.5"/>
    <polygon points="782,582 792,575 802,582 792,589" fill="#D97757"/>
    <line x1="806" y1="582" x2="846" y2="582" stroke="#C9BFAE" stroke-width="1.5"/>
    <text x="856" y="586" font-size="11" fill="#8A7B6B">组合 Composition（菱形在整体端）</text>
    <line x1="782" y1="614" x2="826" y2="614" stroke="#C9BFAE" stroke-width="1.5" marker-end="url(#gen)"/>
    <text x="856" y="618" font-size="11" fill="#8A7B6B">继承 Generalization（三角指向父类）</text>
    <line x1="1020" y1="582" x2="1060" y2="582" stroke="#C9BFAE" stroke-width="1.5"/>
    <text x="1068" y="586" font-size="11" fill="#8A7B6B">关联</text>
  </g>
</svg>
