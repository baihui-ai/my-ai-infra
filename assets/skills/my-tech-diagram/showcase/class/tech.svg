<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#1C2330" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="gen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#0D1117" stroke="#8B949E" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- 背景 + 网格 -->
  <rect width="1200" height="675" fill="#0D1117"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="60" y="58" font-size="22" font-weight="600" fill="#E6EDF3">Order 类图</text>
  <text x="60" y="80" font-size="11" fill="#8B949E">UML Class Diagram</text>

  <!-- ========== Order（核心类，霓虹描边 + glow） ========== -->
  <g>
    <rect x="80" y="120" width="220" height="150" rx="10" fill="#161B22" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
    <text x="190" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#22D3EE">Order</text>
    <line x1="80" y1="156" x2="300" y2="156" stroke="#30363D" stroke-width="1.5"/>
    <text x="96" y="178" font-size="12" fill="#E6EDF3">+ id</text>
    <text x="96" y="200" font-size="12" fill="#E6EDF3">+ status</text>
    <text x="96" y="222" font-size="12" fill="#E6EDF3">+ totalAmount</text>
    <line x1="80" y1="232" x2="300" y2="232" stroke="#30363D" stroke-width="1.5"/>
    <text x="96" y="252" font-size="12" fill="#E6EDF3">+ pay()</text>
    <text x="96" y="266" font-size="12" fill="#E6EDF3">+ cancel()</text>
  </g>

  <!-- ========== OrderLine ========== -->
  <g>
    <rect x="520" y="140" width="220" height="88" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="630" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">OrderLine</text>
    <line x1="520" y1="176" x2="740" y2="176" stroke="#30363D" stroke-width="1.5"/>
    <text x="536" y="198" font-size="12" fill="#E6EDF3">+ quantity</text>
    <text x="536" y="220" font-size="12" fill="#E6EDF3">+ unitPrice</text>
  </g>

  <!-- ========== Product ========== -->
  <g>
    <rect x="880" y="140" width="220" height="88" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="990" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">Product</text>
    <line x1="880" y1="176" x2="1100" y2="176" stroke="#30363D" stroke-width="1.5"/>
    <text x="896" y="198" font-size="12" fill="#E6EDF3">+ name</text>
    <text x="896" y="220" font-size="12" fill="#E6EDF3">+ price</text>
  </g>

  <!-- ========== Customer ========== -->
  <g>
    <rect x="80" y="420" width="220" height="56" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="190" y="453" text-anchor="middle" font-size="14" font-weight="600" fill="#E6EDF3">Customer</text>
  </g>

  <!-- ========== VIPCustomer（子类，紫色点缀） ========== -->
  <g>
    <rect x="80" y="556" width="220" height="56" rx="10" fill="#161B22" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="190" y="589" text-anchor="middle" font-size="14" font-weight="600" fill="#A78BFA">VIPCustomer</text>
  </g>

  <!-- ========== 关系 ========== -->
  <!-- 组合：Order ◆—— OrderLine（实心菱形在整体 Order 端，关键路径青色） -->
  <line x1="318" y1="184" x2="518" y2="184" stroke="#22D3EE" stroke-width="1.5"/>
  <polygon points="300,184 310,177 320,184 310,191" fill="#22D3EE"/>
  <text x="330" y="172" font-size="11" fill="#8B949E">1</text>
  <text x="512" y="172" text-anchor="end" font-size="11" fill="#8B949E">1..*</text>

  <!-- 关联：OrderLine —— Product（Product 端多重性 1） -->
  <line x1="742" y1="184" x2="878" y2="184" stroke="#3D4450" stroke-width="1.5"/>
  <text x="872" y="172" text-anchor="end" font-size="11" fill="#8B949E">1</text>

  <!-- 关联：Order —— Customer（Customer 端多重性 1） -->
  <line x1="190" y1="272" x2="190" y2="418" stroke="#3D4450" stroke-width="1.5"/>
  <text x="202" y="412" font-size="11" fill="#8B949E">1</text>

  <!-- 继承：VIPCustomer —▷ Customer（空心三角指向父类） -->
  <line x1="190" y1="554" x2="190" y2="478" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#gen)"/>

  <!-- ========== 图例 ========== -->
  <g>
    <rect x="760" y="560" width="380" height="76" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <polygon points="782,582 792,575 802,582 792,589" fill="#22D3EE"/>
    <line x1="806" y1="582" x2="846" y2="582" stroke="#3D4450" stroke-width="1.5"/>
    <text x="856" y="586" font-size="11" fill="#8B949E">组合 Composition（菱形在整体端）</text>
    <line x1="782" y1="614" x2="826" y2="614" stroke="#3D4450" stroke-width="1.5" marker-end="url(#gen)"/>
    <text x="856" y="618" font-size="11" fill="#8B949E">继承 Generalization（三角指向父类）</text>
    <line x1="1020" y1="582" x2="1060" y2="582" stroke="#3D4450" stroke-width="1.5"/>
    <text x="1068" y="586" font-size="11" fill="#8B949E">关联</text>
  </g>
</svg>
