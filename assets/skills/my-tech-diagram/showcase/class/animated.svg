<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="gen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2"/>
    </marker>
    <!-- 数据包运动路径（与连线重合，静态降级时隐藏路径本身） -->
    <path id="p-comp" d="M 322 184 H 514" fill="none"/>
    <path id="p-assoc" d="M 744 184 H 874" fill="none"/>
    <path id="p-cust" d="M 190 276 V 414" fill="none"/>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="675" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="60" y="58" font-size="22" font-weight="600" fill="#1F2328">Order 类图</text>
  <text x="60" y="80" font-size="11" fill="#6B7280">UML Class Diagram · Animated (SMIL)</text>

  <!-- ========== Order（核心类，强调色 + 活跃脉冲） ========== -->
  <g>
    <rect x="80" y="120" width="220" height="150" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="190" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#2563EB">Order</text>
    <line x1="80" y1="156" x2="300" y2="156" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="96" y="178" font-size="12" fill="#1F2328">+ id</text>
    <text x="96" y="200" font-size="12" fill="#1F2328">+ status</text>
    <text x="96" y="222" font-size="12" fill="#1F2328">+ totalAmount</text>
    <line x1="80" y1="232" x2="300" y2="232" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="96" y="252" font-size="12" fill="#1F2328">+ pay()</text>
    <text x="96" y="266" font-size="12" fill="#1F2328">+ cancel()</text>
    <!-- 活跃脉冲 -->
    <circle cx="288" cy="132" r="5" fill="#2563EB">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="288" cy="132" r="5" fill="none" stroke="#2563EB" stroke-width="1.5">
      <animate attributeName="r" values="5;12" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ========== OrderLine ========== -->
  <g>
    <rect x="520" y="140" width="220" height="88" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="630" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">OrderLine</text>
    <line x1="520" y1="176" x2="740" y2="176" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="536" y="198" font-size="12" fill="#1F2328">+ quantity</text>
    <text x="536" y="220" font-size="12" fill="#1F2328">+ unitPrice</text>
  </g>

  <!-- ========== Product ========== -->
  <g>
    <rect x="880" y="140" width="220" height="88" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="990" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">Product</text>
    <line x1="880" y1="176" x2="1100" y2="176" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="896" y="198" font-size="12" fill="#1F2328">+ name</text>
    <text x="896" y="220" font-size="12" fill="#1F2328">+ price</text>
  </g>

  <!-- ========== Customer ========== -->
  <g>
    <rect x="80" y="420" width="220" height="56" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="190" y="453" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">Customer</text>
  </g>

  <!-- ========== VIPCustomer ========== -->
  <g>
    <rect x="80" y="556" width="220" height="56" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="190" y="589" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">VIPCustomer</text>
  </g>

  <!-- ========== 关系（实线保持 UML 记号，动画只叠加数据包/脉冲） ========== -->
  <!-- 组合：Order ◆—— OrderLine（实心菱形在整体 Order 端） -->
  <line x1="318" y1="184" x2="518" y2="184" stroke="#9CA3AF" stroke-width="1.5"/>
  <polygon points="300,184 310,177 320,184 310,191" fill="#2563EB">
    <animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"/>
  </polygon>
  <text x="330" y="172" font-size="11" fill="#6B7280">1</text>
  <text x="512" y="172" text-anchor="end" font-size="11" fill="#6B7280">1..*</text>

  <!-- 关联：OrderLine —— Product（Product 端多重性 1） -->
  <line x1="742" y1="184" x2="878" y2="184" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="872" y="172" text-anchor="end" font-size="11" fill="#6B7280">1</text>

  <!-- 关联：Order —— Customer（Customer 端多重性 1） -->
  <line x1="190" y1="272" x2="190" y2="418" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="202" y="412" font-size="11" fill="#6B7280">1</text>

  <!-- 继承：VIPCustomer —▷ Customer（空心三角指向父类） -->
  <line x1="190" y1="554" x2="190" y2="478" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#gen)"/>

  <!-- ========== 数据包动画（静态降级：删掉后实线关系依然成立） ========== -->
  <circle cx="322" cy="184" r="4" fill="#2563EB">
    <animateMotion dur="2s" repeatCount="indefinite"><mpath href="#p-comp"/></animateMotion>
  </circle>
  <circle cx="744" cy="184" r="4" fill="#2563EB" opacity="0.7">
    <animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p-assoc"/></animateMotion>
  </circle>
  <circle cx="190" cy="276" r="4" fill="#2563EB" opacity="0.7">
    <animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p-cust"/></animateMotion>
  </circle>

  <!-- ========== 图例 ========== -->
  <g>
    <rect x="760" y="560" width="380" height="76" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
    <polygon points="782,582 792,575 802,582 792,589" fill="#2563EB"/>
    <line x1="806" y1="582" x2="846" y2="582" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="856" y="586" font-size="11" fill="#6B7280">组合 Composition（菱形在整体端）</text>
    <line x1="782" y1="614" x2="826" y2="614" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#gen)"/>
    <text x="856" y="618" font-size="11" fill="#6B7280">继承 Generalization（三角指向父类）</text>
    <line x1="1020" y1="582" x2="1060" y2="582" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="1068" y="586" font-size="11" fill="#6B7280">关联</text>
  </g>
</svg>
