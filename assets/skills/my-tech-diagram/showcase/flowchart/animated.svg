<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="48" y="46" font-size="20" font-weight="600" fill="#1F2328">售后退款流程图</text>
  <text x="48" y="68" font-size="11" fill="#6B7280">动画风:主流向虚线流动(SMIL)</text>

  <!-- 图例(右上) -->
  <rect x="950" y="62" width="34" height="18" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="994" y="76" font-size="11" fill="#6B7280">开始 / 结束</text>
  <rect x="950" y="90" width="34" height="18" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="994" y="104" font-size="11" fill="#6B7280">处理</text>
  <polygon points="967,116 984,125 967,134 950,125" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="994" y="129" font-size="11" fill="#6B7280">判断</text>

  <!-- ===== 连线(虚线流动,动画元素 ≤10;F→H 静态虚线降级) ===== -->
  <!-- 主轴 -->
  <line x1="340" y1="104" x2="340" y2="124" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.8s" repeatCount="indefinite"/></line>
  <line x1="340" y1="178" x2="340" y2="202" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.8s" repeatCount="indefinite"/></line>
  <!-- D1 否:未发货,直接执行退款 -->
  <line x1="340" y1="316" x2="340" y2="342" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.8s" repeatCount="indefinite"/></line>
  <text x="358" y="332" font-size="12" fill="#6B7280">否</text>
  <!-- D1 是:寄回商品 -->
  <line x1="470" y1="260" x2="688" y2="260" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.8s" repeatCount="indefinite"/></line>
  <text x="500" y="250" text-anchor="middle" font-size="12" fill="#6B7280">是</text>
  <!-- 右侧子流程 -->
  <line x1="780" y1="286" x2="780" y2="310" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.8s" repeatCount="indefinite"/></line>
  <line x1="780" y1="364" x2="780" y2="390" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.8s" repeatCount="indefinite"/></line>
  <!-- D2 是:外侧通道 x=560 汇入 E 右缘 -->
  <polyline points="660,448 560,448 560,370 432,370" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.8s" repeatCount="indefinite"/></polyline>
  <text x="628" y="438" text-anchor="middle" font-size="12" fill="#6B7280">是</text>
  <!-- D2 否:拒绝退款 -->
  <line x1="900" y1="448" x2="1028" y2="448" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.8s" repeatCount="indefinite"/></line>
  <text x="962" y="438" text-anchor="middle" font-size="12" fill="#6B7280">否</text>
  <!-- 主轴末段 -->
  <line x1="340" y1="396" x2="340" y2="418" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.8s" repeatCount="indefinite"/></line>
  <line x1="340" y1="472" x2="340" y2="494" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.8s" repeatCount="indefinite"/></line>
  <!-- F → H:底部外侧通道 y=640(静态虚线) -->
  <polyline points="1120,474 1120,640 600,640 600,522 432,522" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>

  <!-- ===== 节点 ===== -->
  <!-- A 用户申请退款(开始 Terminator,脉冲圆点) -->
  <rect x="250" y="52" width="180" height="52" rx="26" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="340" y="74" text-anchor="middle" font-size="10" fill="#6B7280">开始</text>
  <text x="340" y="92" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">用户申请退款</text>

  <!-- B 校验订单状态(处理) -->
  <rect x="250" y="126" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="340" y="150" text-anchor="middle" font-size="10" fill="#6B7280">处理</text>
  <text x="340" y="168" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">校验订单状态</text>

  <!-- D1 已发货?(判断) -->
  <polygon points="340,204 470,260 340,316 210,260" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="340" y="254" text-anchor="middle" font-size="10" fill="#6B7280">判断</text>
  <text x="340" y="272" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">已发货?</text>

  <!-- C 用户寄回商品(处理) -->
  <rect x="690" y="234" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="780" y="258" text-anchor="middle" font-size="10" fill="#6B7280">处理</text>
  <text x="780" y="276" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">用户寄回商品</text>

  <!-- V 仓库验收(处理) -->
  <rect x="690" y="312" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="780" y="336" text-anchor="middle" font-size="10" fill="#6B7280">处理</text>
  <text x="780" y="354" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">仓库验收</text>

  <!-- D2 完好?(判断) -->
  <polygon points="780,392 900,448 780,504 660,448" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="780" y="442" text-anchor="middle" font-size="10" fill="#6B7280">判断</text>
  <text x="780" y="460" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">完好?</text>

  <!-- E 执行退款(处理,关键节点强调) -->
  <rect x="250" y="344" width="180" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="340" y="368" text-anchor="middle" font-size="10" fill="#6B7280">处理</text>
  <text x="340" y="386" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">执行退款</text>

  <!-- F 拒绝退款(处理) -->
  <rect x="1030" y="422" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="1120" y="446" text-anchor="middle" font-size="10" fill="#6B7280">处理</text>
  <text x="1120" y="464" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">拒绝退款</text>

  <!-- G 退款到账(处理) -->
  <rect x="250" y="420" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="340" y="444" text-anchor="middle" font-size="10" fill="#6B7280">处理</text>
  <text x="340" y="462" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">退款到账</text>

  <!-- H 结束(Terminator) -->
  <rect x="250" y="496" width="180" height="52" rx="26" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="340" y="527" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2328">结束</text>
</svg>
